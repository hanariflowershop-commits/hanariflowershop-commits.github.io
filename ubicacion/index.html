<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ubícanos — Hanari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#F6F0E4;
    --paper:#FBF8F1;
    --ink:#18140F;
    --rose:#B5504B;
    --rose-deep:#83322E;
    --cobalt:#2E5596;
    --line: rgba(24,20,15,0.14);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background-color: var(--cream);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  h1,h2,h3{ font-family: 'Shippori Mincho', serif; font-weight: 800; }
  a{ color: inherit; }

  /* ================= NAV (igual al resto del sitio) ================= */
  nav{
    position: sticky; top: 0; z-index: 150;
    background: rgba(246,240,228,0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  nav .navwrap{
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
  }
  .logo{ display: flex; align-items: center; gap: 10px; }
  .logo img{ height: 26px; width: auto; }
  .navlinks{ display: flex; gap: 30px; font-size: 0.92rem; }
  .navlinks a{ position: relative; padding: 4px 0; text-decoration: none; }
  .navlinks a.active{ color: var(--rose-deep); }
  .navlinks a::after{
    content:""; position:absolute; left:0; bottom:0; width:0; height:1.5px;
    background: var(--rose); transition: width .25s ease;
  }
  .navlinks a:hover::after, .navlinks a.active::after{ width: 100%; }

  .navtoggle{
    display: none;
    background: none; border: none; cursor: pointer;
    width: 38px; height: 38px; padding: 0; margin: 0;
    align-items: center; justify-content: center;
    position: relative; z-index: 160;
  }
  .navtoggle span{
    position: absolute; left: 8px; right: 8px; height: 2px;
    background: var(--ink); border-radius: 2px;
    transition: transform .3s ease, opacity .3s ease, top .3s ease;
  }
  .navtoggle span:nth-child(1){ top: 13px; }
  .navtoggle span:nth-child(2){ top: 19px; }
  .navtoggle span:nth-child(3){ top: 25px; }
  .navtoggle.open span:nth-child(1){ top: 19px; transform: rotate(45deg); }
  .navtoggle.open span:nth-child(2){ opacity: 0; }
  .navtoggle.open span:nth-child(3){ top: 19px; transform: rotate(-45deg); }

  @media(max-width:820px){
    .navlinks{
      display: flex; flex-direction: column; align-items: flex-start; gap: 0;
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--paper); border-bottom: 1px solid var(--line);
      max-height: 0; overflow: hidden; transition: max-height .35s ease;
    }
    .navlinks.open{ max-height: 420px; }
    .navlinks a{ width: 100%; padding: 14px 28px; border-top: 1px solid var(--line); }
    .navlinks a::after{ display: none; }
    .navtoggle{ display: flex; }
  }

  .page-wrap{ max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }

  @media(max-width:768px){
    .page-wrap{ padding: 10px 0 0; }
  }
</style>
</head>
<body>

<!-- ===== NAV ===== -->
<nav>
  <div class="navwrap">
    <a class="logo" href="https://hanariec.com/">
      <img src="https://hanariec.com/images/hanarilogo.png" alt="Hanari">
    </a>

    <div class="navlinks" id="navlinks">
      <a href="https://hanariec.com/coffee">Coffee</a>
      <a href="https://hanariec.com/flower">Flower</a>
      <a href="https://hanariec.com/journey">Journey</a>
      <a href="https://hanariec.com/menu">Menú</a>
      <a href="https://hanariec.com/retos">Retos</a>
      <a class="active" href="https://hanariec.com/ubicacion">Ubícanos</a>
    </div>

    <button class="navtoggle" id="navtoggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navlinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<script>
  const navtoggle = document.getElementById('navtoggle');
  const navlinks = document.getElementById('navlinks');
  navtoggle.addEventListener('click', () => {
    const isOpen = navlinks.classList.toggle('open');
    navtoggle.classList.toggle('open', isOpen);
    navtoggle.setAttribute('aria-expanded', isOpen);
  });
  navlinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navlinks.classList.remove('open');
      navtoggle.classList.remove('open');
      navtoggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>

<div class="page-wrap">

<div class="map-container">

  <div id="map"></div>

  <!-- BOTÓN GOOGLE MAPS -->
  <a href="https://www.google.com/maps/search/?api=1&query=Hanari+Coffee" target="_blank" class="maps-float" id="mapsBtn">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Google_Maps_icon_%282015-2020%29.svg" alt="Google Maps Icon">
    <span>Ver en Google Maps</span>
  </a>

  <!-- PANEL -->
  <div id="panel" class="panel">

    <div class="panel-toggle top">Presione para explorar información</div>

    <h3>Hanari Coffee ☕</h3>

    <b>Ubicación</b>
    <img src="./Ubicacion 1.jpeg" alt="Ubicación 1">
    <img src="./Ubicacion 3.jpeg" alt="Ubicación 3">

    <b>Local</b>
    <img src="./Local 1.jpeg" alt="Local 1">
    <img src="./Local 2.jpeg" alt="Local 2">
    <img src="./Local 3.jpeg" alt="Local 3">

    <b>Productos</b>
    <div class="carousel">
      <img src="./Producto 1.jpeg" alt="Producto 1">
      <img src="./Producto 2.jpeg" alt="Producto 2">
      <img src="./Producto 3.jpeg" alt="Producto 3">
      <img src="./Producto 4.jpeg" alt="Producto 4">
      <img src="./Producto 5.jpeg" alt="Producto 5">
    </div>

    <div class="panel-toggle bottom">Toque para cerrar</div>

  </div>

</div>

</div>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<style>
/* --- ESTILOS PARA ESCRITORIO (PC) --- */
.map-container {
  position: relative;
  width: 100%;
  height: 85vh; /* Ocupa el 85% del alto de pantalla en PC (elimina la franja blanca) */
  min-height: 550px;
  border-radius: 16px;
  overflow: hidden; /* Mantiene bordes limpios sin desbordes */
}

#map {
  width: 100%;
  height: 100%;
}

.panel {
  position: absolute;
  top: 20px; /* Anclado arriba en PC */
  bottom: 20px; /* Anclado abajo en PC */
  left: 20px;
  width: 320px;
  max-height: calc(100% - 40px); /* Ajusta el alto máximo para que no se salga del contenedor */
  overflow-y: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  padding: 16px;
  z-index: 10;
  scroll-behavior: smooth;
  box-sizing: border-box;
}

.panel h3 {
  margin-top: 0;
  font-size: 18px;
}

.panel b {
  display: block;
  margin: 12px 0 6px 0;
  font-size: 14px;
}

.panel img {
  width: 100%;
  border-radius: 8px;
  margin-bottom: 8px;
  display: block;
}

.carousel {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding-bottom: 4px;
}

.carousel img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  flex-shrink: 0;
}

.maps-float {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  z-index: 20;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  transition: opacity 0.3s ease;
}

.maps-float img {
  width: 24px;
  height: 24px;
}

.maps-float.fade {
  opacity: 0;
  pointer-events: none;
}

@keyframes ripple {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(4); opacity: 0; }
}

.panel-toggle {
  display: none;
}

/* --- ESTILOS INTACTOS PARA TELÉFONO (MÓVIL) --- */
@media (max-width: 768px) {
  .map-container {
    height: calc(100svh - 90px);
    min-height: auto;
    border-radius: 0px;
  }

  .maps-float {
    top: 12px;
    right: 12px;
    padding: 8px 12px;
    font-size: 12px;
  }

  .panel-toggle {
    display: block;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 8px;
    border-radius: 8px;
    background: #f0f0f0;
    color: #444;
  }

  .panel-toggle.bottom {
    margin-top: 10px;
  }

  .panel {
    top: auto;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    max-width: 400px;
    max-height: 48px;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .panel.active {
    max-height: 65vh;
    overflow-y: auto;
  }
}
</style>

<script>
setTimeout(() => {
  mapboxgl.accessToken = 'pk.eyJ1IjoiaGFuYXJpLWNvZmZlZSIsImEiOiJjbW56M2oxc3UwN3Z0MnFwdnRvMDcyNnRuIn0.DKGU9hozhxBAg31hAcm5MA';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [-78.614622, -0.934952],
    zoom: 17,
    pitch: 65,
    bearing: -20,
    antialias: true
  });

  map.on('load', () => {
    map.addLayer({
      id: '3d-buildings',
      source: 'composite',
      'source-layer': 'building',
      filter: ['==', 'extrude', 'true'],
      type: 'fill-extrusion',
      minzoom: 15,
      paint: {
        'fill-extrusion-color': '#c7b299',
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'min_height'],
        'fill-extrusion-opacity': 0.4
      }
    });

    const el = document.createElement('div');
    el.style.display = 'flex';
    el.style.flexDirection = 'column';
    el.style.alignItems = 'center';
    el.style.position = 'relative';

    const ripple = document.createElement('div');
    ripple.style.position = 'absolute';
    ripple.style.width = '70px';
    ripple.style.height = '70px';
    ripple.style.borderRadius = '50%';
    ripple.style.background = 'rgba(107,79,59,0.4)';
    ripple.style.animation = 'ripple 2s infinite';

    const img = document.createElement('div');
    img.style.backgroundImage = "url('./Mariposa.PNG')";
    img.style.width = '72px';
    img.style.height = '72px';
    img.style.backgroundSize = 'contain';
    img.style.backgroundRepeat = 'no-repeat';
    img.style.zIndex = '2';

    const label = document.createElement('div');
    label.innerText = 'Hanari Coffee';
    label.style.background = 'white';
    label.style.padding = '2px 6px';
    label.style.borderRadius = '4px';
    label.style.fontSize = '12px';
    label.style.fontWeight = 'bold';
    label.style.marginTop = '4px';
    label.style.boxShadow = '0 2px 4px rgba(0,0,0,0.2)';

    el.appendChild(ripple);
    el.appendChild(img);
    el.appendChild(label);

    new mapboxgl.Marker(el)
      .setLngLat([-78.614622, -0.934952])
      .addTo(map);
  });
}, 300);

const panel = document.getElementById('panel');
const mapsBtn = document.getElementById('mapsBtn');

panel.addEventListener('click', () => {
  if (window.innerWidth <= 768) {
    if (panel.classList.contains('active')) {
      panel.classList.remove('active');
      mapsBtn.classList.remove('fade');
      setTimeout(() => { panel.scrollTop = 0; }, 200);
    } else {
      panel.classList.add('active');
      mapsBtn.classList.add('fade');
    }
  }
});
</script>

</body>
</html>
