<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaso Místico - Hanari Ofertas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1015;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .mystic-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      text-align: center;
    }

    /* Aura luminosa detrás */
    .glow-aura {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(138, 43, 226, 0.25) 50%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      z-index: 1;
      animation: pulseAura 3s infinite alternate ease-in-out;
    }

    /* Contenedor del Vaso */
    .glass-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 260px;
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .glass-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      transition: filter 0.3s ease;
    }

    /* Animación de sacudida */
    .vibrate {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Tarjeta de Premio Oculta */
    .reward-card {
      display: none;
      position: relative;
      z-index: 3;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 2px solid #ffd700;
      border-radius: 16px;
      padding: 25px 20px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .reward-card h2 {
      color: #ffd700;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .reward-card p {
      font-size: 0.95rem;
      color: #ddd;
      margin-bottom: 15px;
    }

    .coupon-code {
      background: #ffd700;
      color: #111;
      font-weight: bold;
      font-size: 1.3rem;
      padding: 10px 15px;
      border-radius: 8px;
      letter-spacing: 2px;
      display: inline-block;
      user-select: all;
    }

    /* Botón */
    .btn-reveal {
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #111;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-reveal:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Keyframes */
    @keyframes pulseAura {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-2deg); }
      20%, 80% { transform: translate3d(4px, 0, 0) rotate(4deg); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-6deg); }
      40%, 60% { transform: translate3d(6px, 0, 0) rotate(6deg); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="mystic-container">
    <div class="glow-aura"></div>

    <!-- Vaso Místico con la RUTA RUTA CORREGIDA: ../images/vasomist.png -->
    <div class="glass-wrapper" id="glassWrapper">
      <img src="../images/vasomist.png" alt="Vaso Místico Hanari" class="glass-img" id="glassImg" />
    </div>

    <!-- Tarjeta de Premio que aparece al abrir -->
    <div class="reward-card" id="rewardCard">
      <h2>¡Felicidades! 🎉</h2>
      <p>Has desbloqueado un descuento místico:</p>
      <div class="coupon-code">HANARI2026</div>
    </div>

    <br>
    <button class="btn-reveal" id="btnReveal">Abrir Vaso Místico</button>
  </div>

  <script>
    const glassWrapper = document.getElementById('glassWrapper');
    const glassImg = document.getElementById('glassImg');
    const btnReveal = document.getElementById('btnReveal');
    const rewardCard = document.getElementById('rewardCard');

    function openMysticCup() {
      btnReveal.disabled = true;

      // 1. Iniciar vibración
      glassImg.classList.add('vibrate');

      // 2. Transición y revelado
      setTimeout(() => {
        // Desvanecer el vaso
        glassWrapper.style.opacity = '0';
        glassWrapper.style.transform = 'scale(0.8)';

        setTimeout(() => {
          glassWrapper.style.display = 'none';
          rewardCard.style.display = 'block'; // Mostrar tarjeta de regalo
          btnReveal.textContent = '¡Descuento Revelado!';
        }, 400);

      }, 600);
    }

    btnReveal.addEventListener('click', openMysticCup);
    glassWrapper.addEventListener('click', openMysticCup);
  </script>
</body>
</html>
