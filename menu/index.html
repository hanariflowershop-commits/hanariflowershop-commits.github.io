<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Hanari Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- PRECARGA DE ARCHIVOS -->
    <link rel="preload" href="Liur.PNG" as="image">
    <link rel="preload" href="menu image.jpeg" as="image">

    <!-- Librería PinchZoom para gestionar los gestos táctiles y el ratón de forma fluida -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pinch-zoom-js/2.3.4/pinch-zoom.min.js"></script>

    <style>
        :root{
            --cream:#F6F0E4;
            --paper:#FBF8F1;
            --ink:#18140F;
            --rose:#B5504B;
            --rose-deep:#83322E;
            --cobalt:#2E5596;
            --line: rgba(24,20,15,0.14);
        }

        /* Estilos generales */
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--cream);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Zen Kaku Gothic New', Arial, sans-serif;
            overflow-x: hidden;
        }

        body.menu-abierto {
            overflow-y: auto;
        }

        h1,h2,h3 { font-family: 'Shippori Mincho', serif; font-weight: 800; }
        a { color: inherit; }

        /* ================= NAV (igual al resto del sitio) ================= */
        nav{
            position: sticky; top: 0; z-index: 150;
            background: rgba(246,240,228,0.94);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--line);
        }
        nav .navwrap{
            max-width: 1180px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 28px;
        }
        .logo{ display: flex; align-items: center; gap: 10px; }
        .logo img{ height: 26px; width: auto; }
        .navlinks{ display: flex; gap: 30px; font-size: 0.92rem; }
        .navlinks a{ position: relative; padding: 4px 0; text-decoration: none; }
        .navlinks a.active{ color: var(--rose-deep); }
        .navlinks a::after{
            content:""; position:absolute; left:0; bottom:0; width:0; height:1.5px;
            background: var(--rose); transition: width .25s ease;
        }
        .navlinks a:hover::after, .navlinks a.active::after{ width: 100%; }

        .navtoggle{
            display: none;
            background: none; border: none; cursor: pointer;
            width: 38px; height: 38px; padding: 0; margin: 0;
            align-items: center; justify-content: center;
            position: relative; z-index: 160;
        }
        .navtoggle span{
            position: absolute; left: 8px; right: 8px; height: 2px;
            background: var(--ink); border-radius: 2px;
            transition: transform .3s ease, opacity .3s ease, top .3s ease;
        }
        .navtoggle span:nth-child(1){ top: 13px; }
        .navtoggle span:nth-child(2){ top: 19px; }
        .navtoggle span:nth-child(3){ top: 25px; }
        .navtoggle.open span:nth-child(1){ top: 19px; transform: rotate(45deg); }
        .navtoggle.open span:nth-child(2){ opacity: 0; }
        .navtoggle.open span:nth-child(3){ top: 19px; transform: rotate(-45deg); }

        @media(max-width:820px){
            .navlinks{
                display: flex; flex-direction: column; align-items: flex-start; gap: 0;
                position: absolute; top: 100%; left: 0; right: 0;
                background: var(--paper); border-bottom: 1px solid var(--line);
                max-height: 0; overflow: hidden; transition: max-height .35s ease;
            }
            .navlinks.open{ max-height: 400px; }
            .navlinks a{ width: 100%; padding: 14px 28px; border-top: 1px solid var(--line); }
            .navlinks a::after{ display: none; }
            .navtoggle{ display: flex; }
        }

        /* ================= ÁREA DEL PERGAMINO ================= */
        .menu-main{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 50px;
        }

        /* CONTENEDOR PRINCIPAL DEL PERGAMINO */
        .pergamino-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.5s ease;
        }

        /* El cuerpo del pergamino (la imagen del menú) */
        .pergamino-cuerpo {
            max-width: 85vw;
            max-height: calc(100vh - 150px);
            width: 0px; /* Inicia cerrado */
            overflow: hidden;
            transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 4px solid #8B4513;
            border-bottom: 4px solid #8B4513;
        }

        /* Contenedor específico para el área de zoom */
        .zoom-wrapper {
            width: 100%;
            height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* La imagen dentro del pergamino */
        .pergamino-cuerpo img {
            height: calc(100vh - 150px);
            width: auto;
            display: block;
            pointer-events: none; 
            max-width: none;
        }

        .pergamino-container.abierto .pergamino-cuerpo img {
            pointer-events: auto;
        }

        /* Los rodillos de madera laterales */
        .rodillo {
            width: 25px;
            height: calc(100vh - 130px);
            background: linear-gradient(to right, #5c2c16, #8B4513, #5c2c16);
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 10;
            cursor: pointer;
        }

        .rodillo::before, .rodillo::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 31px;
            height: 15px;
            background: linear-gradient(to right, #b8860b, #ffd700, #b8860b);
            border-radius: 3px;
        }
        .rodillo::before { top: -15px; }
        .rodillo::after { bottom: -15px; }

        /* Cuando el pergamino está ABIERTO */
        .pergamino-container.abierto .pergamino-cuerpo {
            width: 100%; 
        }

        /* ========================================================
           PERSONAJE: LIUR (PANDA ROJO) Y GLOBO DE TEXTO (VISTA PC)
           ======================================================== */
        .liur-asistente {
            position: absolute;
            left: -320px; 
            display: flex;
            flex-direction: row; 
            align-items: center;
            z-index: 20;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none; 
        }

        /* Imagen de Liur */
        .liur-img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        /* Globo de diálogo estilo cómic/bocadillo */
        .liur-globo {
            background-color: var(--paper);
            color: var(--ink);
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 2px solid var(--rose-deep);
            max-width: 180px;
            position: relative;
            margin-right: 15px; 
        }

        /* Flecha del globo apuntando a la derecha */
        .liur-globo::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 10px 0 10px 10px;
            border-style: solid;
            border-color: transparent transparent transparent var(--paper);
            display: block;
            width: 0;
        }
        
        .liur-globo::before {
            content: '';
            position: absolute;
            right: -13px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 11px 0 11px 11px;
            border-style: solid;
            border-color: transparent transparent transparent var(--rose-deep);
            display: block;
            width: 0;
            z-index: -1;
        }

        /* Ocultar a Liur cuando el pergamino esté abierto */
        .pergamino-container.abierto .liur-asistente {
            opacity: 0;
            transform: translateX(-30px);
        }

        .nav-actions{ display: flex; align-items: center; gap: 12px; }

        /* ========================================================
           BOTÓN DISCRETO DE CONTROL DE MÚSICA
           ======================================================== */
        #btnMusica {
            background: var(--rose-deep);
            color: var(--paper);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(24,20,15,0.2);
            transition: transform 0.2s ease, background 0.2s ease;
            opacity: 0.9;
            flex-shrink: 0;
        }

        #btnMusica:hover {
            opacity: 1;
            transform: scale(1.08);
            background: var(--cobalt);
        }

        /* ========================================================
           BOTÓN "HACER PEDIDO" -> menu-ordenes
           ======================================================== */
        #btnPedido {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--sage-deep, #586B4E);
            color: var(--paper);
            border-radius: 999px;
            padding: 9px 16px;
            font-family: 'Zen Kaku Gothic New', Arial, sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(24,20,15,0.2);
            transition: transform 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        #btnPedido:hover {
            background: var(--rose-deep);
            transform: translateY(-1px);
        }

        #btnPedido .icono {
            font-size: 1rem;
        }

        @media(max-width:480px){
            .nav-actions{ gap: 8px; }
            #btnPedido{ padding: 8px 12px; font-size: 0.78rem; gap: 4px; }
            #btnPedido .icono{ font-size: 0.92rem; }
        }

        /* ========================================================
           VISTA DISPOSITIVOS MÓVILES
           ======================================================== */
        @media (max-width: 768px) and (orientation: portrait) {
            .pergamino-container {
                transform: rotate(90deg);
                transform-origin: center center;
            }

            .pergamino-cuerpo {
                max-width: 80vh;  
                max-height: 85vw; 
            }

            .zoom-wrapper {
                height: 85vw;
            }

            .pergamino-cuerpo img {
                height: 85vw; 
                width: auto;
            }

            .rodillo {
                height: calc(85vw + 20px);
            }

            .liur-asistente {
                transform: rotate(-90deg);
                top: auto;
                left: -190px; 
                flex-direction: row; 
            }

            .liur-globo {
                margin-bottom: 0;
                margin-right: 15px;
                max-width: 160px;
                font-size: 0.85rem;
            }

            .liur-globo::after {
                bottom: auto;
                left: auto;
                right: -10px;
                top: 50%;
                transform: translateY(-50%);
                border-width: 10px 0 10px 10px;
                border-color: transparent transparent transparent var(--paper);
            }
            .liur-globo::before {
                bottom: auto;
                left: auto;
                right: -13px;
                top: 50%;
                transform: translateY(-50%);
                border-width: 11px 0 11px 11px;
                border-color: transparent transparent transparent var(--rose-deep);
            }

            .pergamino-container.abierto .liur-asistente {
                opacity: 0;
                transform: rotate(-90deg) translateX(-20px);
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAV ===== -->
    <nav>
        <div class="navwrap">
            <a class="logo" href="https://hanariec.com/">
                <img src="https://hanariec.com/images/hanarilogo.png" alt="Hanari">
            </a>

            <div class="navlinks" id="navlinks">
                <a href="https://hanariec.com/coffee">Coffee</a>
                <a href="https://hanariec.com/flower">Flower</a>
                <a href="https://hanariec.com/journey">Journey</a>
                <a class="active" href="https://hanariec.com/menu">Menú</a>
                <a href="https://hanariec.com/retos">Retos</a>
                <a href="https://hanariec.com/ubicacion">Ubícanos</a>
            </div>

            <div class="nav-actions">
                <button id="btnMusica" onclick="toggleControlMusica()" title="Música de fondo">🔊</button>
                <a id="btnPedido" href="https://hanariec.com/menu-ordenes" title="Hacer un pedido">
                    <span class="icono">🛒</span><span class="txt">Hacer Pedido</span>
                </a>
                <button class="navtoggle" id="navtoggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navlinks">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ELEMENTO DE AUDIO EN SEGUNDO PLANO -->
    <audio id="musicaFondo" loop preload="auto">
        <source src="musica-fondo.mp3" type="audio/mpeg">
    </audio>

    <main class="menu-main">
      <div class="pergamino-container">
        
        <!-- PERSONAJE LIUR CON SU TEXTO EXPLICATIVO -->
        <div class="liur-asistente">
            <div class="liur-globo">¡Hola! Presiona los rodillos de madera para abrir el menú 📜</div>
            <img src="Liur.PNG" alt="Liur el Panda Rojo" class="liur-img">
        </div>

        <!-- Rodillo Izquierdo -->
        <div class="rodillo" onclick="togglePergamino()"></div>

        <!-- Cuerpo del pergamino -->
        <div class="pergamino-cuerpo">
            <div class="zoom-wrapper" id="zoom-area">
                <img src="menu image.jpeg" alt="Menú Hanari Coffee" id="menu-img">
            </div>
        </div>

        <!-- Rodillo Derecho -->
        <div class="rodillo" onclick="togglePergamino()"></div>
      </div>
    </main>

    <script>
        // ---- Menú hamburguesa (móvil) ----
        const navtoggle = document.getElementById('navtoggle');
        const navlinks = document.getElementById('navlinks');

        navtoggle.addEventListener('click', () => {
            const isOpen = navlinks.classList.toggle('open');
            navtoggle.classList.toggle('open', isOpen);
            navtoggle.setAttribute('aria-expanded', isOpen);
        });

        navlinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navlinks.classList.remove('open');
                navtoggle.classList.remove('open');
                navtoggle.setAttribute('aria-expanded', 'false');
            });
        });

        let pzInstance = null;
        let primeraVezMusica = true;

        function inicializarZoom() {
            const el = document.getElementById('zoom-area');
            if (el && !pzInstance) {
                pzInstance = new PinchZoom(el, {
                    tapZoomFactor: 2,
                    maxZoom: 4,
                    minZoom: 1,
                    draggableUnzoomed: false 
                });
            }
        }

        // Se ejecuta al tocar los rodillos por primera vez
        function activarMusicaAutomatica() {
            const audio = document.getElementById('musicaFondo');
            const btn = document.getElementById('btnMusica');

            if (primeraVezMusica) {
                audio.play().then(() => {
                    primeraVezMusica = false;
                }).catch(err => {
                    console.log("Audio bloqueado por el navegador hasta interactuar:", err);
                });
            }
        }

        // Permite al usuario mutear/desmutear libremente
        function toggleControlMusica() {
            const audio = document.getElementById('musicaFondo');
            const btn = document.getElementById('btnMusica');

            if (audio.paused) {
                audio.play();
                btn.textContent = '🔊';
            } else {
                audio.pause();
                btn.textContent = '🔇';
            }
        }

        function togglePergamino() {
            // Reproduce la música al presionar para abrir el pergamino
            activarMusicaAutomatica();

            const container = document.querySelector('.pergamino-container');
            const estaAbierto = container.classList.toggle('abierto');
            
            if (estaAbierto) {
                document.body.classList.add('menu-abierto');
                
                setTimeout(() => {
                    inicializarZoom();
                }, 1500);
            } else {
                document.body.classList.remove('menu-abierto');
                
                if (pzInstance) {
                    pzInstance.setTransform({
                        x: 0,
                        y: 0,
                        scale: 1,
                        animate: true
                    });
                }
            }
        }
    </script>
</body>
</html>
