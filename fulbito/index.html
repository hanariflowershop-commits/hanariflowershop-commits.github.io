<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Panda Football Juggling</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  font-family: system-ui, -apple-system, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: #111;
}

#startBar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 400px;
  background: rgba(17, 17, 17, 0.9);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 20px;
  font-size: 16px;
  z-index: 10;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
}

.centered {
  position: fixed !important;
  top: 50% !important;
  left: 50% !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
  height: auto !important;
  padding: 24px;
  border-radius: 16px;
  width: 85%;
  max-width: 420px;
  box-sizing: border-box;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(8px);
  border: 2px solid #4CAF50;
}

#scoreBox {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  z-index: 5;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#scoreIcon {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

#score {
  font-size: 22px;
  font-weight: bold;
  color: #111;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>
<div id="startBar">CARGANDO RECURSOS...</div>

<div id="scoreBox">
  <img id="scoreIcon" src="../retos/Caraiconopanda.png" alt="Panda">
  <span id="score">0</span>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const startBar = document.getElementById("startBar");

const isPC = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

/* 🔊 AUDIO LOCAL DESDE LA CARPETA RETOS */
const music = new Audio("../retos/dino.mp3");
music.loop = true;
music.volume = 0.25;
music.setAttribute("playsinline", "");

function playMusic() {
  music.play().catch(() => {});
}

/* 📳 VIBRACIÓN */
function vibrate(pattern) {
  if (navigator.vibrate) { navigator.vibrate(pattern); }
}

/* 📐 RESIZE OPTIMIZADO */
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* 🖼️ PRECARGADOR DE IMÁGENES CON PROMESAS */
function loadImage(path) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(img);
    img.src = encodeURI(path);
  });
}

/* RUTAS DESDE LA CARPETA APARTE HACIA RETOS */
const mobileBGPaths = [
  "../retos/fondo1.png", "../retos/fondo1denoche.png", "../retos/fondoinvierno.png",
  "../retos/fondootoño.png", "../retos/fondoprimavera.png", "../retos/fondosakuras.png"
];

const pcBGPaths = [
  "../retos/fondo1horizontal.png", "../retos/fondo1denochehorizontal.png", "../retos/fondoinviernohorizontal.png",
  "../retos/fondootoñohorizontal.png", "../retos/fondosakurashorizontal.png"
];

const spritePaths = {
  run1: "../retos/corriendo1.png",
  run2: "../retos/corriendo2.png",
  midAir: "../retos/enmediodelsalto.png",
  fall: "../retos/cayendo.png",
  idle: "../retos/Quietodefrente.png",
  dead: "../retos/muerte1.png"
};

let backgrounds = [];
let sprites = {};
let assetsLoaded = false;

async function preloadAssets() {
  const bgPaths = isPC ? pcBGPaths : mobileBGPaths;
  
  const [loadedBGs, loadedSpriteEntries] = await Promise.all([
    Promise.all(bgPaths.map(loadImage)),
    Promise.all(Object.entries(spritePaths).map(async ([key, path]) => [key, await loadImage(path)]))
  ]);

  backgrounds = loadedBGs;
  sprites = Object.fromEntries(loadedSpriteEntries);

  assetsLoaded = true;
  startBar.innerText = isPC ? "USA LAS FLECHAS / A-D PARA MOVERTE" : "TOCA LA IZQUIERDA O DERECHA PARA MOVERTE";
}
preloadAssets();

/* 🎮 ESTADO DEL JUEGO */
let gameStarted = false, gameOver = false, gameWin = false, score = 0;
let frame = 0;

/* 🐼 OBJETO PANDA */
let panda = {
  x: 0,
  y: 0,
  w: 100,
  h: 100,
  vx: 0,
  speed: 7,
  jumpAnimTimer: 0,
  facingLeft: false
};

/* ⚽ OBJETO BALÓN */
let ball = {
  x: 0,
  y: 0,
  radius: 20,
  vx: 0,
  vy: 0,
  gravity: 0.35,
  rotation: 0
};

/* 🕹️ CONTROLES */
let keys = { left: false, right: false };

function resetGame() {
  gameStarted = true;
  gameOver = false;
  gameWin = false;
  score = 0;
  frame = 0;

  panda.w = 100;
  panda.h = 100;
  panda.x = canvas.width / 2 - panda.w / 2;
  panda.y = canvas.height - panda.h - 30;
  panda.jumpAnimTimer = 0;

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 3;
  ball.vx = (Math.random() - 0.5) * 4;
  ball.vy = -2;

  scoreText.innerText = "0";

  music.currentTime = 0;
  playMusic();

  startBar.classList.remove("centered");
  startBar.style.display = isPC ? "none" : "block";
  startBar.innerText = "DOMINA EL BALÓN SIN DEJARLO CAER";
}

function getBGIndex() {
  if (score >= 50) return backgrounds.length - 1;
  return Math.floor(score / 10) % backgrounds.length;
}

function drawBG() {
  const bg = backgrounds[getBGIndex()];
  if (bg && bg.complete && bg.naturalWidth > 0) {
    const scale = Math.max(canvas.width / bg.width, canvas.height / bg.height);
    ctx.drawImage(bg,
      (canvas.width - bg.width * scale) / 2,
      (canvas.height - bg.height * scale) / 2,
      bg.width * scale,
      bg.height * scale
    );
  } else {
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function showVictory() {
  const code = "HC" + Math.floor(Math.random() * 90000 + 10000);
  startBar.classList.add("centered");
  startBar.style.display = "flex";
  startBar.innerHTML = `
    🏆 ¡CAMPEÓN DE DOMINADAS!<br>
    Liur y Charni celebran tu jugada<br><br>
    🎁 Ganaste un Hana Café<br>
    🎟 Código: <b>${code}</b><br>
    <small>Presenta captura</small>
  `;
}

function drawPanda() {
  let img = sprites.idle;

  if (gameOver) {
    img = sprites.dead;
  } else if (panda.jumpAnimTimer > 0) {
    img = panda.jumpAnimTimer > 10 ? sprites.midAir : sprites.fall;
  } else if (keys.left || keys.right) {
    img = Math.floor(frame / 8) % 2 === 0 ? sprites.run1 : sprites.run2;
  }

  ctx.save();
  ctx.translate(panda.x + panda.w / 2, panda.y + panda.h / 2);

  if (panda.facingLeft) {
    ctx.scale(-1, 1);
  }

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -panda.w / 2, -panda.h / 2, panda.w, panda.h);
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-panda.w / 2, -panda.h / 2, panda.w, panda.h);
  }
  ctx.restore();
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rotation);

  // Dibujo vectorial de balón de fútbol
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#000000";
  ctx.stroke();

  // Detalle del balón (parches negros)
  ctx.fillStyle = "#000000";
  for (let i = 0; i < 5; i++) {
    const angle = (i * Math.PI * 2) / 5;
    const px = Math.cos(angle) * (ball.radius * 0.5);
    const py = Math.sin(angle) * (ball.radius * 0.5);
    ctx.beginPath();
    ctx.arc(px, py, ball.radius * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function update() {
  if (!gameStarted || gameOver) return;

  frame++;

  /* Victoria al llegar a 50 dominadas */
  if (score >= 50 && !gameWin) {
    gameWin = true;
    showVictory();
  }

  /* Movimiento horizontal Panda */
  if (keys.left) {
    panda.x -= panda.speed;
    panda.facingLeft = true;
  }
  if (keys.right) {
    panda.x += panda.speed;
    panda.facingLeft = false;
  }

  /* Limites de pantalla para el Panda */
  if (panda.x < 0) panda.x = 0;
  if (panda.x + panda.w > canvas.width) panda.x = canvas.width - panda.w;

  if (panda.jumpAnimTimer > 0) panda.jumpAnimTimer--;

  /* Física del Balón */
  ball.vy += ball.gravity;
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.rotation += ball.vx * 0.05;

  /* Rebote en paredes laterales */
  if (ball.x - ball.radius < 0) {
    ball.x = ball.radius;
    ball.vx *= -0.8;
  }
  if (ball.x + ball.radius > canvas.width) {
    ball.x = canvas.width - ball.radius;
    ball.vx *= -0.8;
  }

  /* Colisión Balón con Panda */
  const hitBoxPadding = 15;
  const px = panda.x + hitBoxPadding;
  const py = panda.y + hitBoxPadding;
  const pw = panda.w - hitBoxPadding * 2;
  const ph = panda.h - hitBoxPadding * 2;

  if (
    ball.x + ball.radius > px &&
    ball.x - ball.radius < px + pw &&
    ball.y + ball.radius > py &&
    ball.y - ball.radius < py + ph &&
    ball.vy > 0
  ) {
    ball.vy = -10.5 - Math.min(score * 0.1, 3); // Aumenta levemente la fuerza
    
    // El impacto cambia el ángulo horizontal según dónde le pegue
    const hitPoint = (ball.x - (panda.x + panda.w / 2)) / (panda.w / 2);
    ball.vx = hitPoint * 7;

    panda.jumpAnimTimer = 20; // Dispara sprite midAir/fall
    vibrate(15);

    if (!gameWin) {
      score++;
      scoreText.innerText = score;
    }
  }

  /* Derrota: El balón toca el piso */
  if (ball.y + ball.radius >= canvas.height - 10) {
    triggerGameOver();
  }
}

function triggerGameOver() {
  if (gameWin) return;
  gameOver = true;
  music.pause();
  vibrate([60, 40, 80]);
  startBar.innerText = "¡SE CAYÓ EL BALÓN! TOCAR PARA REINICIAR";
  startBar.style.display = "flex";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBG();
  drawPanda();
  drawBall();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function handleInputStart(clientX) {
  if (!assetsLoaded) return;

  if (!gameStarted || gameOver) {
    resetGame();
    return;
  }

  playMusic();

  if (clientX < window.innerWidth / 2) {
    keys.left = true;
    keys.right = false;
  } else {
    keys.right = true;
    keys.left = false;
  }
}

function handleInputEnd() {
  keys.left = false;
  keys.right = false;
}

/* CONTROLES TÁCTILES */
window.addEventListener("pointerdown", (e) => handleInputStart(e.clientX));
window.addEventListener("pointerup", handleInputEnd);

/* CONTROLES TECLADO (PC) */
window.addEventListener("keydown", (e) => {
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) {
    if (e.code === "Space" || e.code === "Enter") resetGame();
    return;
  }
  playMusic();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
});

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

requestAnimationFrame(loop);
</script>

</body>
</html>
