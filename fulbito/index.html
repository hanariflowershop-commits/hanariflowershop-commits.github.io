<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panda Football Juggling</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  font-family: system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Área de Juego */
#gameContainer {
  position: relative;
  width: 100vw;
  flex: 1;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #111;
}

/* Controles Inferiores elevados con 35% de transparencia */
#controlsArea {
  height: auto;
  min-height: 95px;
  background: rgba(15, 15, 15, 0.4);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 20px;
  margin-bottom: max(65px, env(safe-area-inset-bottom, 65px));
  border-top: 2px solid rgba(214, 87, 48, 0.4);
  z-index: 20;
}

.control-btn {
  width: 42%;
  max-width: 180px;
  height: 60px;
  background: rgba(214, 87, 48, 0.35);
  color: rgba(255, 255, 255, 0.85);
  border: 2px solid rgba(242, 147, 119, 0.4);
  border-radius: 16px;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  touch-action: manipulation;
  cursor: pointer;
  opacity: 0.35; /* 35% de transparencia */
  transition: opacity 0.1s ease;
}

.control-btn:active {
  opacity: 0.7;
  transform: scale(0.96);
}

#startBar {
  position: fixed;
  bottom: 190px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 400px;
  background: rgba(17, 17, 17, 0.9);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  font-size: 15px;
  z-index: 10;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  pointer-events: none;
}

.centered {
  position: fixed !important;
  top: 50% !important;
  left: 50% !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
  height: auto !important;
  padding: 24px;
  border-radius: 16px;
  width: 85%;
  max-width: 420px;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(8px);
  border: 2px solid #D65730;
  pointer-events: auto !important;
}

#scoreBox {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  z-index: 25;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#scoreIcon {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

#score {
  font-size: 22px;
  font-weight: bold;
  color: #111;
}

@media (hover: hover) and (pointer: fine) {
  #controlsArea {
    display: none;
  }
  #startBar {
    bottom: 20px;
  }
}
</style>
</head>

<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="startBar">CARGANDO RECURSOS...</div>

  <div id="scoreBox">
    <img id="scoreIcon" src="../retos/Caraiconopanda.png" alt="Panda">
    <span id="score">0</span>
  </div>
</div>

<div id="controlsArea">
  <div class="control-btn" id="btnLeft">◄</div>
  <div class="control-btn" id="btnRight">►</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const startBar = document.getElementById("startBar");
const container = document.getElementById("gameContainer");

const isPC = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

/* 🔊 AUDIO LOCAL */
const music = new Audio("../retos/fulbo.mp3");
music.loop = true;
music.volume = 0.25;
music.setAttribute("playsinline", "");

function playMusic() {
  music.play().catch(() => {});
}

/* 📳 VIBRACIÓN */
function vibrate(pattern) {
  if (navigator.vibrate) { navigator.vibrate(pattern); }
}

/* 📐 RESIZE OPTIMIZADO */
function resize() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}
resize();
window.addEventListener("resize", resize);

/* 🖼️ PRECARGADOR DE IMÁGENES */
function loadImage(path) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(img);
    img.src = encodeURI(path);
  });
}

const bgPath = "../retos/fulbo.png";

const spritePaths = {
  run1: "../retos/corriendo1.png",
  run2: "../retos/corriendo2.png",
  midAir: "../retos/enmediodelsalto.png",
  fall: "../retos/cayendo.png",
  idle: "../retos/Quietodefrente.png",
  dead: "../retos/muerte1.png"
};

const ballImagePath = "https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg";

let background = null;
let sprites = {};
let ballImg = null;
let assetsLoaded = false;

async function preloadAssets() {
  const [loadedBG, loadedSpriteEntries, loadedBall] = await Promise.all([
    loadImage(bgPath),
    Promise.all(Object.entries(spritePaths).map(async ([key, path]) => [key, await loadImage(path)])),
    loadImage(ballImagePath)
  ]);

  background = loadedBG;
  sprites = Object.fromEntries(loadedSpriteEntries);
  ballImg = loadedBall;

  assetsLoaded = true;
  startBar.innerText = isPC ? "PRESIONA PARA EMPEZAR" : "TOCA PARA EMPEZAR A JUGAR";
}
preloadAssets();

/* 🎮 ESTADO DEL JUEGO */
let gameStarted = false, gameOver = false, gameWin = false, score = 0;
let frame = 0;

/* 🐼 OBJETO PANDA */
let panda = {
  x: 0,
  y: 0,
  w: 100,
  h: 100,
  vx: 0,
  speed: 8,
  jumpAnimTimer: 0,
  facingLeft: false
};

/* ⚽ OBJETO BALÓN */
let ball = {
  x: 0,
  y: 0,
  radius: 24,
  vx: 0,
  vy: 0,
  gravity: 0.42,
  rotation: 0
};

/* 🕹️ CONTROLES */
let keys = { left: false, right: false };

function resetGame() {
  gameStarted = true;
  gameOver = false;
  gameWin = false;
  score = 0;
  frame = 0;

  panda.w = 100;
  panda.h = 100;
  panda.x = canvas.width / 2 - panda.w / 2;
  panda.y = canvas.height - panda.h - 10;
  panda.jumpAnimTimer = 0;

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 3;
  ball.vx = (Math.random() - 0.5) * 4;
  ball.vy = -3;

  scoreText.innerText = "0";

  music.currentTime = 0;
  playMusic();

  /* Ocultamos completamente el mensaje al comenzar la partida */
  startBar.classList.remove("centered");
  startBar.style.display = "none";
}

function drawBG() {
  if (background && background.complete && background.naturalWidth > 0) {
    const scale = Math.max(canvas.width / background.width, canvas.height / background.height);
    ctx.drawImage(background,
      (canvas.width - background.width * scale) / 2,
      (canvas.height - background.height * scale) / 2,
      background.width * scale,
      background.height * scale
    );
  } else {
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function showVictory() {
  const code = "HC" + Math.floor(Math.random() * 90000 + 10000);
  startBar.classList.add("centered");
  startBar.style.display = "flex";
  startBar.innerHTML = `
    🏆 ¡CAMPEÓN DE DOMINADAS!<br>
    Liur y Charni celebran tu jugada<br><br>
    🎁 Ganaste un Hana Café<br>
    🎟 Código: <b>${code}</b><br>
    <small>Presenta captura</small>
  `;
}

function drawPanda() {
  let img = sprites.idle;
  let renderWidth = panda.w;
  let renderHeight = panda.h;

  if (gameOver) {
    img = sprites.dead;
  } else if (panda.jumpAnimTimer > 0) {
    img = panda.jumpAnimTimer > 10 ? sprites.midAir : sprites.fall;
    renderWidth = panda.w * 1.35;
    renderHeight = panda.h * 1.35;
  } else if (keys.left || keys.right) {
    img = Math.floor(frame / 8) % 2 === 0 ? sprites.run1 : sprites.run2;
  }

  ctx.save();

  const drawX = panda.x + panda.w / 2;
  const drawY = (panda.y + panda.h) - renderHeight / 2;

  ctx.translate(drawX, drawY);

  if (panda.facingLeft) {
    ctx.scale(-1, 1);
  }

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, -renderWidth / 2, -renderHeight / 2, renderWidth, renderHeight);
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-renderWidth / 2, -renderHeight / 2, renderWidth, renderHeight);
  }
  ctx.restore();
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rotation);

  if (ballImg && ballImg.complete && ballImg.naturalWidth > 0) {
    ctx.drawImage(ballImg, -ball.radius, -ball.radius, ball.radius * 2, ball.radius * 2);
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

function update() {
  if (!gameStarted || gameOver) return;

  frame++;

  if (score >= 50 && !gameWin) {
    gameWin = true;
    showVictory();
  }

  /* Movimiento horizontal Panda */
  if (keys.left) {
    panda.x -= panda.speed;
    panda.facingLeft = true;
  }
  if (keys.right) {
    panda.x += panda.speed;
    panda.facingLeft = false;
  }

  /* Límites de pantalla */
  if (panda.x < 0) panda.x = 0;
  if (panda.x + panda.w > canvas.width) panda.x = canvas.width - panda.w;

  if (panda.jumpAnimTimer > 0) panda.jumpAnimTimer--;

  /* Física del Balón */
  ball.vy += ball.gravity;
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.rotation += ball.vx * 0.04;

  /* Rebote lateral */
  if (ball.x - ball.radius < 0) {
    ball.x = ball.radius;
    ball.vx *= -0.8;
  }
  if (ball.x + ball.radius > canvas.width) {
    ball.x = canvas.width - ball.radius;
    ball.vx *= -0.8;
  }

  /* Colisión con Panda */
  const hitBoxPadding = 12;
  const px = panda.x + hitBoxPadding;
  const py = panda.y + hitBoxPadding;
  const pw = panda.w - hitBoxPadding * 2;
  const ph = panda.h - hitBoxPadding * 2;

  if (
    ball.x + ball.radius > px &&
    ball.x - ball.radius < px + pw &&
    ball.y + ball.radius > py &&
    ball.y - ball.radius < py + ph &&
    ball.vy > 0
  ) {
    ball.vy = -15.5 - Math.min(score * 0.1, 2);
    
    const hitPoint = (ball.x - (panda.x + panda.w / 2)) / (panda.w / 2);
    ball.vx = hitPoint * 7.5;

    panda.jumpAnimTimer = 22;
    vibrate(15);

    if (!gameWin) {
      score++;
      scoreText.innerText = score;
    }
  }

  /* Derrota */
  if (ball.y + ball.radius >= canvas.height - 5) {
    triggerGameOver();
  }
}

function triggerGameOver() {
  if (gameWin) return;
  gameOver = true;
  music.pause();
  vibrate([60, 40, 80]);
  startBar.innerText = "¡SE CAYÓ EL BALÓN! TOCAR PARA REINICIAR";
  startBar.style.display = "flex";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBG();
  drawPanda();
  drawBall();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function handleInputStart(clientX) {
  if (!assetsLoaded) return;

  if (!gameStarted || gameOver) {
    resetGame();
    return;
  }

  playMusic();

  if (clientX < window.innerWidth / 2) {
    keys.left = true;
    keys.right = false;
  } else {
    keys.right = true;
    keys.left = false;
  }
}

function handleInputEnd() {
  keys.left = false;
  keys.right = false;
}

/* EVENTOS DE CONTROLES */
container.addEventListener("pointerdown", (e) => handleInputStart(e.clientX));
container.addEventListener("pointerup", handleInputEnd);

const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");

btnLeft.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) { resetGame(); return; }
  playMusic();
  keys.left = true;
});

btnLeft.addEventListener("pointerup", (e) => {
  e.stopPropagation();
  keys.left = false;
});

btnRight.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) { resetGame(); return; }
  playMusic();
  keys.right = true;
});

btnRight.addEventListener("pointerup", (e) => {
  e.stopPropagation();
  keys.right = false;
});

/* TECLADO PC */
window.addEventListener("keydown", (e) => {
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) {
    if (e.code === "Space" || e.code === "Enter") resetGame();
    return;
  }
  playMusic();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
});

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

requestAnimationFrame(loop);
</script>

</body>
</html>
