<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hanari Coffee - Calculadora de Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
  :root{
    --cream:#F6F0E4;
    --paper:#FBF8F1;
    --ink:#18140F;
    --rose:#B5504B;
    --rose-deep:#83322E;
    --cobalt:#2E5596;
    --line: rgba(24,20,15,0.14);
  }

  /* RESET BÁSICO */
  *{ box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background-color: var(--cream);
    color: var(--ink);
  }
  h1,h2,h3{ font-family:'Shippori Mincho', serif; font-weight:800; }

  /* --- HEADER Y NAVBAR --- */
  .navbar-header {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    background-color: rgba(246,240,228,0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    z-index: 1000;
  }

  .navbar-container {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    box-sizing: border-box;
  }

  .navbar-logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .navbar-logo img {
    height: 26px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  .navbar-menu {
    display: flex;
    gap: 30px;
  }

  .nav-link {
    text-decoration: none;
    color: var(--ink);
    font-size: 0.92rem;
    font-weight: 500;
    transition: color 0.2s ease;
    position: relative;
    padding: 4px 0;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--rose-deep);
  }

  .nav-link::after{
    content:'';
    position:absolute; left:0; bottom:0; width:0; height:1.5px;
    background: var(--rose); transition: width .25s ease;
  }
  .nav-link:hover::after,
  .nav-link.active::after {
    width: 100%;
  }

  .navbar-toggle {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 18px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .navbar-toggle span {
    width: 100%;
    height: 2px;
    background-color: var(--ink);
    border-radius: 2px;
  }

  @media (max-width: 820px) {
    .navbar-container {
      padding: 14px 20px;
    }

    .navbar-toggle {
      display: flex;
    }

    .navbar-menu {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background-color: var(--paper);
      flex-direction: column;
      gap: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-in-out;
      border-bottom: 1px solid var(--line);
    }

    .navbar-menu.show {
      max-height: 400px;
    }

    .nav-link {
      padding: 14px 24px;
      border-top: 1px solid var(--line);
      display: block;
    }

    .nav-link.active::after,
    .nav-link::after {
      display: none;
    }
  }

  /* --- ESTILOS DE LA CALCULADORA --- */
  .calc-page{
    padding: 50px 20px 70px;
  }

  .calc-head{
    text-align: center;
    max-width: 480px;
    margin: 0 auto 30px;
  }
  .calc-head .kicker{ font-size:0.85rem; color:var(--rose-deep); font-weight:600; letter-spacing:0.05em; margin-bottom:8px; }
  .calc-head h1{ font-size: clamp(1.6rem, 3.6vw, 2.1rem); }
  .calc-head p{ margin-top:10px; color:#4a4438; font-size:0.95rem; }

  .calc-container {
    max-width: 420px;
    margin: 0 auto;
    padding: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 12px 34px rgba(24,20,15,0.1);
    box-sizing: border-box;
  }

  .calc-container h3 {
    margin-top: 0;
    color: var(--ink);
    font-family: 'Shippori Mincho', serif;
    font-size: 1.25rem;
    text-align: center;
    margin-bottom: 22px;
  }

  .calc-container label {
    font-size: 0.82rem;
    font-weight: 700;
    color: #4a4438;
    display: inline-block;
    margin-bottom: 6px;
  }

  .calc-container select,
  .calc-container input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.94rem;
    box-sizing: border-box;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  .calc-container select:focus,
  .calc-container input:focus {
    border-color: var(--rose-deep);
  }

  #resultado {
    margin-top: 10px;
    padding: 14px;
    background: var(--cream);
    border: 1px solid var(--rose-deep);
    border-radius: 10px;
    text-align: center;
    color: var(--rose-deep);
    font-size: 1.02rem;
    font-weight: 600;
  }
  </style>
</head>
<body>

  <!-- ENCABEZADO Y NAV -->
  <header class="navbar-header">
    <div class="navbar-container">
      <a href="https://hanariec.com" class="navbar-logo">
        <img src="https://hanariec.com/images/hanarilogo.png" alt="Hanari Logo">
      </a>
      
      <button class="navbar-toggle" id="mobile-menu-btn" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar-menu" id="nav-menu">
        <a href="https://hanariec.com/coffee" class="nav-link active">Coffee</a>
        <a href="https://hanariec.com/flower" class="nav-link">Flower</a>
        <a href="https://hanariec.com/journey" class="nav-link">Journey</a>
        <a href="https://hanariec.com/menu" class="nav-link">Menú</a>
        <a href="https://hanariec.com/retos" class="nav-link">Retos</a>
        <a href="https://hanariec.com/ubicacion" class="nav-link">Ubícanos</a>
      </nav>
    </div>
  </header>

  <!-- CALCULADORA DE CAFÉ -->
  <div class="calc-page">
    <div class="calc-head">
      <div class="kicker">HANARI COFFEE</div>
      <h1>Calculadora de Café</h1>
      <p>Encuentra la proporción ideal de café y agua para tu preparación.</p>
    </div>

    <div class="calc-container">
      <h3>Preparación Café Sidra ☕</h3>

      <label>Intensidad de Sabor:</label><br>
      <select id="intensidad" onchange="calcular()">
        <option value="18">Suave (1:18)</option>
        <option value="16" selected>Medio (1:16)</option>
        <option value="13">Fuerte (1:13)</option>
      </select>

      <label>Calcular según:</label><br>
      <select id="modo" onchange="cambiarModo()">
        <option value="cafe">Gramos de café</option>
        <option value="agua">Mililitros de agua</option>
      </select>

      <div id="inputCafe">
        <label>Gramos de café (1 cuchara ≈ 5g - 7g):</label><br>
        <input type="number" id="cafe" value="15" oninput="calcular()">
      </div>

      <div id="inputAgua" style="display:none;">
        <label>Mililitros de agua (ml):</label><br>
        <input type="number" id="agua" value="240" oninput="calcular()">
      </div>

      <div id="resultado"></div>
    </div>
  </div>

  <script>
  // CONTROL DEL MENÚ MÓVIL
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navMenu = document.getElementById('nav-menu');

  mobileMenuBtn.addEventListener('click', () => {
    navMenu.classList.toggle('show');
  });

  // LÓGICA DE LA CALCULADORA
  function cambiarModo() {
    const modo = document.getElementById("modo").value;
    document.getElementById("inputCafe").style.display = modo === "cafe" ? "block" : "none";
    document.getElementById("inputAgua").style.display = modo === "agua" ? "block" : "none";
    calcular();
  }

  function calcular() {
    const intensidad = parseFloat(document.getElementById("intensidad").value);
    const modo = document.getElementById("modo").value;
    let resultado = "";

    if (modo === "cafe") {
      const gramosCafe = parseFloat(document.getElementById("cafe").value) || 0;
      const agua = gramosCafe * intensidad;
      resultado = `<strong>Usa ${agua.toFixed(0)} ml de agua</strong>`;
    } else {
      const mlAgua = parseFloat(document.getElementById("agua").value) || 0;
      const cafe = mlAgua / intensidad;
      resultado = `<strong>Usa ${cafe.toFixed(1)} g de café</strong>`;
    }

    document.getElementById("resultado").innerHTML = resultado;
  }

  // Ejecuta el cálculo al cargar la página
  calcular();
  </script>

</body>
</html>
