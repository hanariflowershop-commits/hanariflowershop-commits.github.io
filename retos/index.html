<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Elige tu reto y gana | Hana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F6F0E4;
  --paper:#FBF8F1;
  --ink:#18140F;
  --rose:#B5504B;
  --rose-deep:#83322E;
  --cobalt:#2E5596;
  --line: rgba(24,20,15,0.14);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body, html {
  width: 100%;
  height: 100%;
  background: var(--cream);
  color: var(--ink);
  font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* Bloqueo de clics mientras el overlay está activo */
body.overlay-active main {
  pointer-events: none !important;
}

/* ================= NAV (igual al resto del sitio) ================= */
nav.site-nav{
  position: sticky; top: 0; z-index: 500;
  width: 100%;
  background: rgba(246,240,228,0.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
nav.site-nav .navwrap{
  max-width: 1180px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
}
.logo{ display: flex; align-items: center; gap: 10px; }
.logo img{ height: 26px; width: auto; }
.navlinks{ display: flex; gap: 30px; font-size: 0.92rem; }
.navlinks a{ position: relative; padding: 4px 0; color: var(--ink); text-decoration: none; }
.navlinks a.active{ color: var(--rose-deep); }
.navlinks a::after{
  content:""; position:absolute; left:0; bottom:0; width:0; height:1.5px;
  background: var(--rose); transition: width .25s ease;
}
.navlinks a:hover::after, .navlinks a.active::after{ width: 100%; }

.navtoggle{
  display: none;
  background: none; border: none; cursor: pointer;
  width: 38px; height: 38px; padding: 0; margin: 0;
  align-items: center; justify-content: center;
  position: relative; z-index: 510;
}
.navtoggle span{
  position: absolute; left: 8px; right: 8px; height: 2px;
  background: var(--ink); border-radius: 2px;
  transition: transform .3s ease, opacity .3s ease, top .3s ease;
}
.navtoggle span:nth-child(1){ top: 13px; }
.navtoggle span:nth-child(2){ top: 19px; }
.navtoggle span:nth-child(3){ top: 25px; }
.navtoggle.open span:nth-child(1){ top: 19px; transform: rotate(45deg); }
.navtoggle.open span:nth-child(2){ opacity: 0; }
.navtoggle.open span:nth-child(3){ top: 19px; transform: rotate(-45deg); }

@media(max-width:820px){
  .navlinks{
    display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--paper); border-bottom: 1px solid var(--line);
    max-height: 0; overflow: hidden; transition: max-height .35s ease;
  }
  .navlinks.open{ max-height: 420px; }
  .navlinks a{ width: 100%; padding: 14px 28px; border-top: 1px solid var(--line); }
  .navlinks a::after{ display: none; }
  .navtoggle{ display: flex; }
}

/* Pantalla superpuesta */
#start-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  cursor: pointer;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

#start-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.start-btn {
  background: var(--rose-deep);
  color: var(--paper);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 18px;
  font-weight: 800;
  padding: 16px 32px;
  border-radius: 50px;
  border: none;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 0 20px rgba(181, 80, 75, 0.5);
  animation: pulse 1.5s infinite;
  pointer-events: none;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 20px rgba(181, 80, 75, 0.5); }
  50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(181, 80, 75, 0.8); }
  100% { transform: scale(1); box-shadow: 0 0 20px rgba(181, 80, 75, 0.5); }
}

header {
  text-align: center;
  padding: 30px 15px 10px;
  width: 100%;
}

h1 {
  font-family: 'Shippori Mincho', serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--rose-deep);
  text-transform: uppercase;
  margin-bottom: 8px;
}

p.subtitle {
  font-size: 14px;
  color: #4a4438;
  max-width: 380px;
  margin: 0 auto;
  line-height: 1.4;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 450px;
  padding: 20px 15px 15px;
}

.grid-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 34px rgba(24, 20, 15, 0.22);
  border: 1px solid var(--line);
  background-color: var(--paper);
}

.bg-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.quadrant-grid {
  position: absolute;
  top: 0;
  left: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100%;
  height: 100%;
}

.quadrant {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 12px;
  text-decoration: none;
  color: #fff;
  position: relative;
  transition: transform 0.15s ease, background-color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.quadrant:active {
  transform: scale(0.96);
  background-color: rgba(181, 80, 75, 0.18);
}

@media (hover: hover) {
  .quadrant:hover {
    background-color: rgba(181, 80, 75, 0.12);
  }
}

.label-badge {
  background: rgba(24, 20, 15, 0.78);
  backdrop-filter: blur(4px);
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  pointer-events: none;
}

footer {
  padding: 20px 15px 30px;
  text-align: center;
  font-size: 12px;
  color: #6b6252;
}

footer span {
  color: var(--rose-deep);
  font-weight: 700;
}

/* ================= BOTÓN TÉRMINOS Y CONDICIONES ================= */
.terms-fab{
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 60px;
  padding: 10px 6px 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(24, 20, 15, 0.18);
  text-decoration: none;
  color: var(--rose-deep);
  transition: transform .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.terms-fab svg{
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.terms-fab .terms-label{
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.15;
  color: var(--ink);
  text-align: center;
}
.terms-fab:active{ transform: scale(0.94); }
@media (hover: hover){
  .terms-fab:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(24, 20, 15, 0.24);
  }
}
/* Oculto mientras la pantalla de inicio está activa */
body.overlay-active .terms-fab{
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body class="overlay-active">

<!-- ===== NAV ===== -->
<nav class="site-nav">
  <div class="navwrap">
    <a class="logo" href="https://hanariec.com/">
      <img src="https://hanariec.com/images/hanarilogo.png" alt="Hanari">
    </a>

    <div class="navlinks" id="navlinks">
      <a href="https://hanariec.com/coffee">Coffee</a>
      <a href="https://hanariec.com/flower">Flower</a>
      <a href="https://hanariec.com/journey">Journey</a>
      <a href="https://hanariec.com/menu">Menú</a>
      <a class="active" href="https://hanariec.com/retos">Retos</a>
      <a href="https://hanariec.com/ubicacion">Ubícanos</a>
    </div>

    <button class="navtoggle" id="navtoggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navlinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Overlay de inicio -->
<div id="start-overlay">
  <button class="start-btn">▶ Toca para continuar</button>
</div>

<!-- Reproductor de audio con respaldo de extensión -->
<audio id="bg-audio" loop preload="auto">
  <source src="arcade.mp3" type="audio/mpeg" id="audio-src">
</audio>

<header>
  <h1>ELIGE TU RETO Y GANA</h1>
  <p class="subtitle">Selecciona el juego que mejor va con tu estilo.</p>
</header>

<main>
  <div class="grid-container">
    <img 
      src="cuadrante.jpg" 
      onerror="this.onerror=null; this.src='cuadrante.JPG';" 
      alt="Elige tu juego" 
      class="bg-image"
    >

    <div class="quadrant-grid">
      <a href="https://hanariec.com/runner" class="quadrant" aria-label="Jugar Panda Runner">
        <span class="label-badge">🏃 Panda Runner</span>
      </a>

      <a href="https://hanariec.com/flappy" class="quadrant" aria-label="Jugar Panda Flappy">
        <span class="label-badge">🚀 Panda Flappy</span>
      </a>

      <a href="https://hanariec.com/panda-tank" class="quadrant" aria-label="Jugar Panda Tank">
        <span class="label-badge">💥 Panda Tank</span>
      </a>

      <a href="https://hanariec.com/fulbito" class="quadrant" aria-label="Jugar Panda Dominadas">
        <span class="label-badge">⚽ Panda Dominadas</span>
      </a>
    </div>
  </div>
</main>

<footer>
  <p>Hana Games &copy; <span>hanariec.com</span></p>
</footer>

<!-- Botón flotante: Términos y Condiciones -->
<a href="https://hanariec.com/retos/terminos" class="terms-fab" aria-label="Ver Términos y Condiciones">
  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="11" y="9" width="26" height="30" rx="2.5" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="11" cy="9" r="3.4" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="11" cy="39" r="3.4" stroke="currentColor" stroke-width="2.2"/>
    <line x1="17" y1="17" x2="31" y2="17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="17" y1="23.5" x2="31" y2="23.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="17" y1="30" x2="25" y2="30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <span class="terms-label">Términos y&nbsp;Condiciones</span>
</a>

<script>
  // ---- Menú hamburguesa (móvil) ----
  const navtoggle = document.getElementById('navtoggle');
  const navlinks = document.getElementById('navlinks');
  navtoggle.addEventListener('click', () => {
    const isOpen = navlinks.classList.toggle('open');
    navtoggle.classList.toggle('open', isOpen);
    navtoggle.setAttribute('aria-expanded', isOpen);
  });
  navlinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navlinks.classList.remove('open');
      navtoggle.classList.remove('open');
      navtoggle.setAttribute('aria-expanded', 'false');
    });
  });

  const overlay = document.getElementById('start-overlay');
  const audio = document.getElementById('bg-audio');
  const audioSrc = document.getElementById('audio-src');
  let isActivating = false;

  // Respaldo por si el archivo en el servidor se llama arcade.MP3 en mayúsculas
  audioSrc.addEventListener('error', () => {
    if (audioSrc.src.includes('arcade.mp3')) {
      audioSrc.src = 'arcade.MP3';
      audio.load();
    }
  });

  function playAudio() {
    if (isActivating) return;
    isActivating = true;

    // Intentar reproducir directamente
    const promise = audio.play();

    if (promise !== undefined) {
      promise.then(() => {
        // Exito: Ocultamos pantalla negra
        overlay.classList.add('hidden');
        setTimeout(() => {
          document.body.classList.remove('overlay-active');
        }, 300);
      }).catch(err => {
        console.log("Autoplay bloqueado:", err);
        // Si falló por falta de interacción, reseteamos la bandera
        isActivating = false;
      });
    } else {
      overlay.classList.add('hidden');
      document.body.classList.remove('overlay-active');
    }
  }

  // Se escucha de manera standard el click/pointerup (compatible con touch en iOS y Android)
  overlay.addEventListener('click', playAudio);
  overlay.addEventListener('pointerup', playAudio);

  // Si regresa desde el caché de navegación (botón Atrás del navegador)
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      isActivating = false;
      document.body.classList.add('overlay-active');
      overlay.classList.remove('hidden');
    }
  });
</script>

</body>
</html>
