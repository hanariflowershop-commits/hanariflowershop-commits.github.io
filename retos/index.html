<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Elige tu reto y gana | Hana</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body, html {
  width: 100%;
  height: 100%;
  background: #0d0d0d;
  color: #ffffff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

header {
  text-align: center;
  padding: 20px 15px 10px;
  width: 100%;
}

h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #4CAF50;
  text-transform: uppercase;
  margin-bottom: 6px;
  text-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
}

p.subtitle {
  font-size: 14px;
  color: #cccccc;
  max-width: 380px;
  margin: 0 auto;
  line-height: 1.4;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 450px;
  padding: 10px 15px;
}

.grid-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.1);
}

.bg-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.quadrant-grid {
  position: absolute;
  top: 0;
  left: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100%;
  height: 100%;
}

.quadrant {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 12px;
  text-decoration: none;
  color: #fff;
  position: relative;
  transition: transform 0.15s ease, background-color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.quadrant:active {
  transform: scale(0.96);
  background-color: rgba(255, 255, 255, 0.15);
}

@media (hover: hover) {
  .quadrant:hover {
    background-color: rgba(255, 255, 255, 0.1);
  }
}

.label-badge {
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  pointer-events: none;
}

footer {
  padding: 15px;
  text-align: center;
  font-size: 12px;
  color: #777777;
}

footer span {
  color: #ffffff;
  font-weight: 600;
}
</style>
</head>

<body>

<header>
  <h1>ELIGE TU RETO Y GANA</h1>
  <p class="subtitle">Selecciona el juego que mejor va con tu estilo, supera la marca de 50 puntos y reclama tu premio.</p>
</header>

<main>
  <div class="grid-container">
    <!-- RUTA EXACTA A TU CARPETA IMAGES -->
    <img src="images/Icono.png" alt="Elige tu juego" class="bg-image">

    <div class="quadrant-grid">
      <a href="https://hanariec.com/runner" class="quadrant" aria-label="Jugar Panda Runner">
        <span class="label-badge">🏃 Panda Runner</span>
      </a>

      <a href="https://hanariec.com/flappy" class="quadrant" aria-label="Jugar Panda Flappy">
        <span class="label-badge">🚀 Panda Flappy</span>
      </a>

      <a href="https://hanariec.com/panda-tank" class="quadrant" aria-label="Jugar Panda Tank">
        <span class="label-badge">💥 Panda Tank</span>
      </a>

      <a href="https://hanariec.com/fulbito" class="quadrant" aria-label="Jugar Panda Fulbito">
        <span class="label-badge">⚽ Panda Fulbito</span>
      </a>
    </div>
  </div>
</main>

<footer>
  <p>Hana Games &copy; <span>hanariec.com</span></p>
</footer>

</body>
</html>
