<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Elige tu reto y gana | Hana</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body, html {
  width: 100%;
  height: 100%;
  background: #0d0d0d;
  color: #ffffff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* Bloqueo de clics mientras el overlay está activo */
body.overlay-active main {
  pointer-events: none !important;
}

/* Pantalla superpuesta */
#start-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  cursor: pointer;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

#start-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.start-btn {
  background: #4CAF50;
  color: #ffffff;
  font-size: 18px;
  font-weight: 800;
  padding: 16px 32px;
  border-radius: 50px;
  border: none;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
  animation: pulse 1.5s infinite;
  pointer-events: none;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 20px rgba(76, 175, 80, 0.6); }
  50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(76, 175, 80, 0.9); }
  100% { transform: scale(1); box-shadow: 0 0 20px rgba(76, 175, 80, 0.6); }
}

header {
  text-align: center;
  padding: 20px 15px 10px;
  width: 100%;
}

h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #4CAF50;
  text-transform: uppercase;
  margin-bottom: 6px;
  text-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
}

p.subtitle {
  font-size: 14px;
  color: #cccccc;
  max-width: 380px;
  margin: 0 auto;
  line-height: 1.4;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 450px;
  padding: 10px 15px;
}

.grid-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.1);
  background-color: #111;
}

.bg-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.quadrant-grid {
  position: absolute;
  top: 0;
  left: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  width: 100%;
  height: 100%;
}

.quadrant {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 12px;
  text-decoration: none;
  color: #fff;
  position: relative;
  transition: transform 0.15s ease, background-color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.quadrant:active {
  transform: scale(0.96);
  background-color: rgba(255, 255, 255, 0.15);
}

@media (hover: hover) {
  .quadrant:hover {
    background-color: rgba(255, 255, 255, 0.1);
  }
}

.label-badge {
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  pointer-events: none;
}

footer {
  padding: 15px;
  text-align: center;
  font-size: 12px;
  color: #777777;
}

footer span {
  color: #ffffff;
  font-weight: 600;
}
</style>
</head>

<body class="overlay-active">

<!-- Overlay de inicio -->
<div id="start-overlay">
  <button class="start-btn">▶ Toca para continuar</button>
</div>

<!-- Reproductor de audio con respaldo de extensión -->
<audio id="bg-audio" loop preload="auto">
  <source src="arcade.mp3" type="audio/mpeg" id="audio-src">
</audio>

<header>
  <h1>ELIGE TU RETO Y GANA</h1>
  <p class="subtitle">Selecciona el juego que mejor va con tu estilo, supera la marca de 50 puntos y reclama tu premio.</p>
</header>

<main>
  <div class="grid-container">
    <img 
      src="cuadrante.jpg" 
      onerror="this.onerror=null; this.src='cuadrante.JPG';" 
      alt="Elige tu juego" 
      class="bg-image"
    >

    <div class="quadrant-grid">
      <a href="https://hanariec.com/runner" class="quadrant" aria-label="Jugar Panda Runner">
        <span class="label-badge">🏃 Panda Runner</span>
      </a>

      <a href="https://hanariec.com/flappy" class="quadrant" aria-label="Jugar Panda Flappy">
        <span class="label-badge">🚀 Panda Flappy</span>
      </a>

      <a href="https://hanariec.com/panda-tank" class="quadrant" aria-label="Jugar Panda Tank">
        <span class="label-badge">💥 Panda Tank</span>
      </a>

      <a href="https://hanariec.com/fulbito" class="quadrant" aria-label="Jugar Panda Dominadas">
        <span class="label-badge">⚽ Panda Dominadas</span>
      </a>
    </div>
  </div>
</main>

<footer>
  <p>Hana Games &copy; <span>hanariec.com</span></p>
</footer>

<script>
  const overlay = document.getElementById('start-overlay');
  const audio = document.getElementById('bg-audio');
  const audioSrc = document.getElementById('audio-src');
  let isActivating = false;

  // Precarga inicial del audio
  window.addEventListener('DOMContentLoaded', () => {
    audio.load();
  });

  // Respaldo por si el nombre está guardado en mayúsculas (arcade.MP3)
  audioSrc.addEventListener('error', () => {
    if (audioSrc.src.includes('arcade.mp3')) {
      audioSrc.src = 'arcade.MP3';
      audio.load();
    }
  });

  function unlockAudioAndMenu(e) {
    if (isActivating) return;
    isActivating = true;

    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // Forzar reinicio y carga del búfer
    audio.currentTime = 0;
    
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        // Intento secundario si el primer intento de recarga falló
        audio.load();
        audio.play().catch(e => console.log("Error al reproducir audio:", e));
      });
    }

    // Ocultar overlay
    overlay.classList.add('hidden');

    // Desbloquear clics en los botones tras consumir el toque fantasma
    setTimeout(() => {
      document.body.classList.remove('overlay-active');
    }, 350);
  }

  // Detecta cuando el usuario regresa o recarga la página
  window.addEventListener('pageshow', () => {
    isActivating = false;
    document.body.classList.add('overlay-active');
    overlay.classList.remove('hidden');
    audio.pause();
    audio.currentTime = 0;
    audio.load();
  });

  // Escuchar toque o clic en el overlay
  overlay.addEventListener('touchstart', unlockAudioAndMenu, { passive: false });
  overlay.addEventListener('click', unlockAudioAndMenu);
</script>

</body>
</html>
