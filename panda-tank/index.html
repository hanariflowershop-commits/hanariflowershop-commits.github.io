<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panda Tank - Sunset Riders Style</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  font-family: system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Área de Juego */
#gameContainer {
  position: relative;
  width: 100vw;
  flex: 1;
  overflow: hidden;
  cursor: crosshair;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #111;
}

/* Franja Inferior Mantenida */
#bottomBarSpace {
  height: 95px;
  background: rgba(15, 15, 15, 0.95);
  margin-bottom: max(65px, env(safe-area-inset-bottom, 65px));
  border-top: 2px solid rgba(214, 87, 48, 0.4);
  z-index: 20;
  width: 100%;
}

#startBar {
  position: fixed;
  bottom: 180px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 400px;
  background: rgba(17, 17, 17, 0.9);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  font-size: 15px;
  z-index: 10;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  pointer-events: none;
}

.centered {
  position: fixed !important;
  top: 50% !important;
  left: 50% !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
  height: auto !important;
  padding: 24px;
  border-radius: 16px;
  width: 85%;
  max-width: 420px;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(8px);
  border: 2px solid #D65730;
  pointer-events: auto !important;
}

#scoreBox {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  z-index: 25;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#scoreIcon {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

#score {
  font-size: 22px;
  font-weight: bold;
  color: #111;
}
</style>
</head>

<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="startBar">CARGANDO RECURSOS...</div>

  <div id="scoreBox">
    <img id="scoreIcon" src="../retos/Caraiconopanda.png" alt="Panda">
    <span id="score">0</span>
  </div>
</div>

<div id="bottomBarSpace"></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const startBar = document.getElementById("startBar");
const container = document.getElementById("gameContainer");

const isPC = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

/* 🔊 AUDIO LOCAL */
const music = new Audio("musictank.mp3");
music.loop = true;
music.volume = 0.3;
music.setAttribute("playsinline", "");

function playMusic() {
  music.play().catch(() => {});
}

function vibrate(pattern) {
  if (navigator.vibrate) { navigator.vibrate(pattern); }
}

function resize() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}
resize();
window.addEventListener("resize", resize);

/* 🖼️ PRECARGA DE SPRITES */
function loadImage(path) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = encodeURI(path);
  });
}

const spriteFiles = {
  bg: "background.png",
  nearBg: "nearbackground.png",
  tankNormal: "pandatanquenormal.png",
  tankLeft: "pandatanquemirandoalfondoizquierda.png",
  tankRight: "pandatanquemirandoalfondoderecha.png",
  charniCover: "charnicoberturapiedra.png",
  charniShoot: "charnidisparando.png",
  charniLeft: "charniquietoviendoizquierda.png",
  charniRight: "charniquietoviendoderecha.png",
  charniBack: "charniquietoespalda.png",
  charniWin: "charnisaludo.png",
  crosshair: "miradeltanque.png",
  flashPistol: "disparocañonpistola.png",
  spark: "destellosolo.png",
  impactTank: "impactodebalapistolaeneltanque.png",
  impactGround: "impactoensuelo.png",
  explosionBig: "explosionconescombros.png"
};

let images = {};
let assetsLoaded = false;

async function preloadAssets() {
  const entries = Object.entries(spriteFiles);
  const loaded = await Promise.all(entries.map(async ([key, path]) => [key, await loadImage(path)]));
  images = Object.fromEntries(loaded);
  assetsLoaded = true;
  startBar.innerText = isPC ? "CLICK EN LOS ENEMIGOS PARA DISPARAR" : "TOCA EN LOS OBJETIVOS PARA DISPARAR";
}
preloadAssets();

/* 🎮 ESTADO DEL JUEGO */
let gameStarted = false, gameOver = false, gameWin = false, score = 0;
let frame = 0;
let bgScrollX = 0;
const targetScore = 1000; // Objetivo actualizado a 1000 puntos

/* 🐼 JUGADOR (TANQUE FIJO) */
let tank = {
  x: 0,
  y: 0,
  w: 130,
  h: 110,
  state: "normal",
  shootTimer: 0
};

/* 🎯 MIRA Y DISPARO */
let crosshair = { x: -100, y: -100, active: false };
let effects = [];
let enemies = [];

function resetGame() {
  gameStarted = true;
  gameOver = false;
  gameWin = false;
  score = 0;
  frame = 0;
  bgScrollX = 0;

  tank.w = 130;
  tank.h = 110;
  tank.x = canvas.width / 2 - tank.w / 2;
  tank.y = canvas.height - tank.h;
  tank.state = "normal";

  enemies = [];
  effects = [];

  scoreText.innerText = "0";

  music.currentTime = 0;
  playMusic();

  startBar.classList.remove("centered");
  startBar.style.display = "none";
}

/* 👾 GENERACIÓN Y POSICIONAMIENTO REALISTA DE ENEMIGOS */
function spawnEnemy() {
  if (enemies.length >= 4 || gameWin) return;
  
  const spriteTypes = ["charniLeft", "charniRight", "charniBack", "charniWin", "charniCover"];
  const selectedType = spriteTypes[Math.floor(Math.random() * spriteTypes.length)];
  const isCover = selectedType === "charniCover";

  /* Puntos estratégicos en el suelo y fondo coherente para evitar flotar */
  let enemyX, enemyY, scaleRatio;

  if (isCover) {
    // La cobertura de piedra aparece en el terreno cercano/medio, más cerca del suelo/tanque
    enemyX = (0.15 + Math.random() * 0.7) * canvas.width;
    enemyY = canvas.height * 0.58 + Math.random() * (canvas.height * 0.12);
    scaleRatio = 1.0;
  } else {
    // Zona 1: Cerca del poblado al fondo (más pequeños)
    // Zona 2: Base de la falda de las montañas (tamaño medio)
    // Zona 3: Suelo abierto del desierto (tamaño normal)
    const zone = Math.random();
    if (zone < 0.35) {
      // Fondo junto a las casitas del desierto
      enemyX = (0.4 + Math.random() * 0.3) * canvas.width;
      enemyY = canvas.height * 0.46;
      scaleRatio = 0.75;
    } else if (zone < 0.7) {
      // Base inferior de los cañones laterales
      const side = Math.random() > 0.5 ? 0.18 : 0.78;
      enemyX = side * canvas.width + (Math.random() * 30 - 15);
      enemyY = canvas.height * 0.52;
      scaleRatio = 0.85;
    } else {
      // Plano medio en la tierra
      enemyX = (0.12 + Math.random() * 0.76) * canvas.width;
      enemyY = canvas.height * 0.56 + Math.random() * (canvas.height * 0.08);
      scaleRatio = 1.0;
    }
  }

  const baseW = isCover ? 75 : 58;
  const baseH = isCover ? 70 : 78;

  enemies.push({
    x: enemyX,
    y: enemyY,
    w: baseW * scaleRatio,
    h: baseH * scaleRatio,
    isCover: isCover,
    baseSprite: selectedType,
    hp: isCover ? 2 : 1,
    shootCooldown: Math.floor(Math.random() * 60) + 40,
    state: "idle"
  });
}

function showVictory() {
  gameWin = true;
  music.pause();
  vibrate([100, 50, 100, 50, 200]);
  const code = "TK" + Math.floor(Math.random() * 90000 + 10000);
  startBar.classList.add("centered");
  startBar.style.display = "flex";
  startBar.innerHTML = `
    🏆 ¡MISIÓN CUMPLIDA!<br>
    Has alcanzado los 1000 PUNTOS<br><br>
    🎁 Ganaste un Hana Café<br>
    🎟 Código: <b>${code}</b><br>
    <small>Toca para volver a jugar</small>
  `;
}

function shootPlayer(targetX, targetY) {
  if (!gameStarted || gameOver || gameWin) return;

  vibrate(15);
  tank.shootTimer = 6;

  if (targetX < tank.x) tank.state = "left";
  else if (targetX > tank.x + tank.w) tank.state = "right";
  else tank.state = "normal";

  let hit = false;
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    if (
      targetX >= e.x &&
      targetX <= e.x + e.w &&
      targetY >= e.y &&
      targetY <= e.y + e.h
    ) {
      hit = true;
      e.hp--;

      effects.push({
        type: "spark",
        x: targetX - 20, y: targetY - 20,
        w: 40, h: 40, life: 6
      });

      if (e.hp <= 0) {
        effects.push({
          type: "explosionBig",
          x: e.x - 10, y: e.y - 10,
          w: e.w + 20, h: e.h + 20, life: 14
        });
        enemies.splice(i, 1);
        score += 10;
        scoreText.innerText = score;

        if (score >= targetScore) {
          showVictory();
        }
      }
      break;
    }
  }

  if (!hit) {
    effects.push({
      type: "impactGround",
      x: targetX - 15, y: targetY - 15,
      w: 30, h: 30, life: 8
    });
  }
}

/* 🎨 RENDERIZADO */
function drawBackground() {
  bgScrollX = (bgScrollX + 0.8) % canvas.width;

  if (images.bg) {
    ctx.drawImage(images.bg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#2b1810";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (images.nearBg) {
    const nearH = canvas.height * 0.25;
    const nearY = canvas.height - nearH;
    ctx.drawImage(images.nearBg, -bgScrollX, nearY, canvas.width, nearH);
    ctx.drawImage(images.nearBg, canvas.width - bgScrollX, nearY, canvas.width, nearH);
  }
}

function drawEnemies() {
  enemies.forEach(e => {
    let sprite = images[e.baseSprite];
    if (e.state === "shooting" && images.charniShoot) {
      sprite = images.charniShoot;
    }

    if (sprite) {
      ctx.drawImage(sprite, e.x, e.y, e.w, e.h);
    } else {
      ctx.fillStyle = "#e04f26";
      ctx.fillRect(e.x, e.y, e.w, e.h);
    }
  });
}

function drawTank() {
  tank.x = canvas.width / 2 - tank.w / 2;
  tank.y = canvas.height - tank.h + 5;

  let sprite = images.tankNormal;
  if (tank.state === "left" && images.tankLeft) sprite = images.tankLeft;
  if (tank.state === "right" && images.tankRight) sprite = images.tankRight;

  if (sprite) {
    ctx.drawImage(sprite, tank.x, tank.y, tank.w, tank.h);
  } else {
    ctx.fillStyle = "#2d5bb9";
    ctx.fillRect(tank.x, tank.y, tank.w, tank.h);
  }
}

function drawEffects() {
  for (let i = effects.length - 1; i >= 0; i--) {
    let fx = effects[i];
    let sprite = images[fx.type];
    if (sprite) {
      ctx.drawImage(sprite, fx.x, fx.y, fx.w, fx.h);
    }
    fx.life--;
    if (fx.life <= 0) effects.splice(i, 1);
  }
}

function drawCrosshair() {
  if (crosshair.active && images.crosshair) {
    ctx.drawImage(images.crosshair, crosshair.x - 25, crosshair.y - 25, 50, 50);
  }
}

/* 🔄 UPDATE */
function update() {
  if (!gameStarted || gameOver || gameWin) return;

  frame++;

  if (tank.shootTimer > 0) {
    tank.shootTimer--;
    if (tank.shootTimer === 0) tank.state = "normal";
  }

  if (frame % 75 === 0) spawnEnemy();

  enemies.forEach(e => {
    e.shootCooldown--;
    if (e.shootCooldown <= 0) {
      e.state = "shooting";
      e.shootCooldown = 90 + Math.random() * 45;

      effects.push({
        type: "flashPistol",
        x: e.x, y: e.y, w: 25, h: 25, life: 5
      });

      effects.push({
        type: "impactTank",
        x: tank.x + Math.random() * (tank.w - 30),
        y: tank.y + 20,
        w: 30, h: 30, life: 8
      });

      vibrate(25);
    } else if (e.shootCooldown < 70 && e.state === "shooting") {
      e.state = "idle";
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawEnemies();
  drawTank();
  drawEffects();
  drawCrosshair();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* 🖱️ CONTROLES TÁCTILES Y MOUSE */
function handlePointerDown(e) {
  if (!assetsLoaded) return;

  if (!gameStarted || gameOver || gameWin) {
    resetGame();
    return;
  }

  playMusic();

  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  crosshair.x = clickX;
  crosshair.y = clickY;
  crosshair.active = true;

  shootPlayer(clickX, clickY);
}

container.addEventListener("pointerdown", handlePointerDown);

container.addEventListener("pointermove", (e) => {
  if (gameStarted && !gameOver && !gameWin) {
    const rect = canvas.getBoundingClientRect();
    crosshair.x = e.clientX - rect.left;
    crosshair.y = e.clientY - rect.top;
    crosshair.active = true;
  }
});

/* TECLADO PC PARA REINICIAR */
window.addEventListener("keydown", (e) => {
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver || gameWin) {
    if (e.code === "Space" || e.code === "Enter") resetGame();
  }
});

requestAnimationFrame(loop);
</script>

</body>
</html>
