<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panda Tank - Sunset Riders Style</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  font-family: system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Área de Juego */
#gameContainer {
  position: relative;
  width: 100vw;
  flex: 1;
  overflow: hidden;
  cursor: crosshair;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #111;
}

/* Controles Inferiores elevados con 35% de transparencia */
#controlsArea {
  height: auto;
  min-height: 95px;
  background: rgba(15, 15, 15, 0.4);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 20px;
  margin-bottom: max(65px, env(safe-area-inset-bottom, 65px));
  border-top: 2px solid rgba(214, 87, 48, 0.4);
  z-index: 20;
}

.control-btn {
  width: 42%;
  max-width: 180px;
  height: 60px;
  background: rgba(214, 87, 48, 0.35);
  color: rgba(255, 255, 255, 0.85);
  border: 2px solid rgba(242, 147, 119, 0.4);
  border-radius: 16px;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  touch-action: manipulation;
  cursor: pointer;
  opacity: 0.35;
  transition: opacity 0.1s ease;
}

.control-btn:active {
  opacity: 0.7;
  transform: scale(0.96);
}

#startBar {
  position: fixed;
  bottom: 190px;
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  max-width: 400px;
  background: rgba(17, 17, 17, 0.9);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 20px;
  font-size: 15px;
  z-index: 10;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  pointer-events: none;
}

.centered {
  position: fixed !important;
  top: 50% !important;
  left: 50% !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
  height: auto !important;
  padding: 24px;
  border-radius: 16px;
  width: 85%;
  max-width: 420px;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(8px);
  border: 2px solid #D65730;
  pointer-events: auto !important;
}

#scoreBox {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.9);
  padding: 8px 16px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  z-index: 25;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#scoreIcon {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

#score {
  font-size: 22px;
  font-weight: bold;
  color: #111;
}

@media (hover: hover) and (pointer: fine) {
  #controlsArea {
    display: none;
  }
  #startBar {
    bottom: 20px;
  }
}
</style>
</head>

<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="startBar">CARGANDO RECURSOS...</div>

  <div id="scoreBox">
    <img id="scoreIcon" src="../retos/Caraiconopanda.png" alt="Panda">
    <span id="score">0</span>
  </div>
</div>

<div id="controlsArea">
  <div class="control-btn" id="btnLeft">◄</div>
  <div class="control-btn" id="btnRight">►</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const startBar = document.getElementById("startBar");
const container = document.getElementById("gameContainer");

const isPC = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

/* 🔊 AUDIO LOCAL */
const music = new Audio("musictank.mp3");
music.loop = true;
music.volume = 0.3;
music.setAttribute("playsinline", "");

function playMusic() {
  music.play().catch(() => {});
}

function vibrate(pattern) {
  if (navigator.vibrate) { navigator.vibrate(pattern); }
}

function resize() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}
resize();
window.addEventListener("resize", resize);

/* 🖼️ PRECARGA DE SPRITES */
function loadImage(path) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = encodeURI(path);
  });
}

const spriteFiles = {
  bg: "background.png",
  nearBg: "nearbackground.png",
  tankNormal: "pandatanquenormal.png",
  tankLeft: "pandatanquemirandoalfondoizquierda.png",
  tankRight: "pandatanquemirandoalfondoderecha.png",
  charniCover: "charnicoberturapiedra.png",
  charniShoot: "charnidisparando.png",
  charniLeft: "charniquietoviendoizquierda.png",
  charniRight: "charniquietoviendoderecha.png",
  charniBack: "charniquietoespalda.png",
  charniWin: "charnisaludo.png",
  crosshair: "miradeltanque.png",
  flashTank: "disparocañontanque.png",
  flashPistol: "disparocañonpistola.png",
  spark: "destellosolo.png",
  impactPistol: "impactodebalapistola.png",
  impactTank: "impactodebalapistolaeneltanque.png",
  impactGround: "impactoensuelo.png",
  explosionSmall: "explosionpequeña.png",
  explosionBig: "explosionconescombros.png",
  smoke: "nubedehumo.png"
};

let images = {};
let assetsLoaded = false;

async function preloadAssets() {
  const entries = Object.entries(spriteFiles);
  const loaded = await Promise.all(entries.map(async ([key, path]) => [key, await loadImage(path)]));
  images = Object.fromEntries(loaded);
  assetsLoaded = true;
  startBar.innerText = isPC ? "CLICK PARA APUNTAR Y DISPARAR | A-D PARA MOVERTE" : "TOCA EN LA PANTALLA PARA JUGAR Y DISPARAR";
}
preloadAssets();

/* 🎮 ESTADO DEL JUEGO */
let gameStarted = false, gameOver = false, gameWin = false, score = 0;
let frame = 0;
let bgScrollX = 0;

/* 🐼 JUGADOR (TANQUE) */
let tank = {
  x: 0,
  y: 0,
  w: 120,
  h: 100,
  speed: 7,
  state: "normal", // "normal", "left", "right"
  shootTimer: 0
};

/* 🎯 MIRA Y DISPARO */
let crosshair = { x: -100, y: -100, active: false };
let effects = [];
let enemies = [];
let enemyBullets = [];

/* 🕹️ CONTROLES */
let keys = { left: false, right: false };

function resetGame() {
  gameStarted = true;
  gameOver = false;
  gameWin = false;
  score = 0;
  frame = 0;
  bgScrollX = 0;

  tank.w = 130;
  tank.h = 110;
  tank.x = canvas.width / 2 - tank.w / 2;
  tank.y = canvas.height - tank.h - 10;
  tank.state = "normal";

  enemies = [];
  enemyBullets = [];
  effects = [];

  scoreText.innerText = "0";

  music.currentTime = 0;
  playMusic();

  startBar.classList.remove("centered");
  startBar.style.display = "none";
}

/* 👾 ENEMIGOS (CHARNI) */
function spawnEnemy() {
  if (enemies.length >= 3) return;
  const isCover = Math.random() > 0.5;
  const sideMargin = 60;
  const enemyX = sideMargin + Math.random() * (canvas.width - sideMargin * 2);
  const enemyY = canvas.height * 0.35 + Math.random() * (canvas.height * 0.2);

  enemies.push({
    x: enemyX,
    y: enemyY,
    w: isCover ? 70 : 55,
    h: isCover ? 65 : 75,
    isCover: isCover,
    hp: isCover ? 2 : 1,
    shootCooldown: Math.floor(Math.random() * 80) + 60,
    state: isCover ? "cover" : "idle"
  });
}

function shootPlayer(targetX, targetY) {
  if (!gameStarted || gameOver) return;

  vibrate(20);
  tank.shootTimer = 8;

  // Determinar dirección del cañón
  if (targetX < tank.x) tank.state = "left";
  else if (targetX > tank.x + tank.w) tank.state = "right";
  else tank.state = "normal";

  // Efecto de fogonazo en tanque
  effects.push({
    type: "flashTank",
    x: tank.x + tank.w / 2 - 25,
    y: tank.y - 20,
    w: 50, h: 50, life: 5
  });

  // Comprobar impacto en enemigos
  let hit = false;
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    if (
      targetX >= e.x &&
      targetX <= e.x + e.w &&
      targetY >= e.y &&
      targetY <= e.y + e.h
    ) {
      hit = true;
      e.hp--;

      effects.push({
        type: "spark",
        x: targetX - 20, y: targetY - 20,
        w: 40, h: 40, life: 6
      });

      if (e.hp <= 0) {
        effects.push({
          type: "explosionBig",
          x: e.x - 10, y: e.y - 10,
          w: e.w + 20, h: e.h + 20, life: 15
        });
        enemies.splice(i, 1);
        score += 10;
        scoreText.innerText = score;
      }
      break;
    }
  }

  if (!hit) {
    effects.push({
      type: "impactGround",
      x: targetX - 15, y: targetY - 15,
      w: 30, h: 30, life: 10
    });
  }
}

/* 🎨 RENDERIZADO */
function drawBackground() {
  bgScrollX = (bgScrollX + 1) % canvas.width;

  // Fondo lejano
  if (images.bg) {
    ctx.drawImage(images.bg, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#2b1810";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Fondo cercano (Near Background con movimiento)
  if (images.nearBg) {
    const nearH = canvas.height * 0.25;
    const nearY = canvas.height - nearH - 40;
    ctx.drawImage(images.nearBg, -bgScrollX, nearY, canvas.width, nearH);
    ctx.drawImage(images.nearBg, canvas.width - bgScrollX, nearY, canvas.width, nearH);
  }
}

function drawEnemies() {
  enemies.forEach(e => {
    let sprite = images.charniLeft;
    if (e.isCover) sprite = images.charniCover;
    else if (e.state === "shooting") sprite = images.charniShoot;

    if (sprite) {
      ctx.drawImage(sprite, e.x, e.y, e.w, e.h);
    } else {
      ctx.fillStyle = "#e04f26";
      ctx.fillRect(e.x, e.y, e.w, e.h);
    }
  });
}

function drawTank() {
  let sprite = images.tankNormal;
  if (tank.state === "left" && images.tankLeft) sprite = images.tankLeft;
  if (tank.state === "right" && images.tankRight) sprite = images.tankRight;

  if (sprite) {
    ctx.drawImage(sprite, tank.x, tank.y, tank.w, tank.h);
  } else {
    ctx.fillStyle = "#2d5bb9";
    ctx.fillRect(tank.x, tank.y, tank.w, tank.h);
  }
}

function drawEffects() {
  for (let i = effects.length - 1; i >= 0; i--) {
    let fx = effects[i];
    let sprite = images[fx.type];
    if (sprite) {
      ctx.drawImage(sprite, fx.x, fx.y, fx.w, fx.h);
    }
    fx.life--;
    if (fx.life <= 0) effects.splice(i, 1);
  }
}

function drawCrosshair() {
  if (crosshair.active && images.crosshair) {
    ctx.drawImage(images.crosshair, crosshair.x - 25, crosshair.y - 25, 50, 50);
  }
}

/* 🔄 UPDATE */
function update() {
  if (!gameStarted || gameOver) return;

  frame++;

  // Movimiento del Tanque
  if (keys.left) tank.x -= tank.speed;
  if (keys.right) tank.x += tank.speed;

  if (tank.x < 0) tank.x = 0;
  if (tank.x + tank.w > canvas.width) tank.x = canvas.width - tank.w;

  if (tank.shootTimer > 0) {
    tank.shootTimer--;
    if (tank.shootTimer === 0) tank.state = "normal";
  }

  // Generación de Enemigos
  if (frame % 90 === 0) spawnEnemy();

  // Comportamiento de Enemigos y Disparos
  enemies.forEach(e => {
    e.shootCooldown--;
    if (e.shootCooldown <= 0) {
      e.state = "shooting";
      e.shootCooldown = 110 + Math.random() * 60;

      // Disparo del enemigo al jugador
      effects.push({
        type: "flashPistol",
        x: e.x, y: e.y, w: 30, h: 30, life: 6
      });

      // Impacto en el tanque
      effects.push({
        type: "impactTank",
        x: tank.x + Math.random() * (tank.w - 30),
        y: tank.y + 10,
        w: 35, h: 35, life: 10
      });

      vibrate([40, 20, 40]);
    } else if (e.shootCooldown < 90 && e.state === "shooting") {
      e.state = e.isCover ? "cover" : "idle";
    }
  });
}

function triggerGameOver() {
  gameOver = true;
  music.pause();
  vibrate([100, 50, 100]);
  startBar.innerText = "¡MISION FALLIDA! TOCAR PARA REINICIAR";
  startBar.style.display = "flex";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawEnemies();
  drawTank();
  drawEffects();
  drawCrosshair();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* 🖱️ EVENTOS Y CONTROLES */
function handlePointerDown(e) {
  if (!assetsLoaded) return;

  if (!gameStarted || gameOver) {
    resetGame();
    return;
  }

  playMusic();

  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  crosshair.x = clickX;
  crosshair.y = clickY;
  crosshair.active = true;

  shootPlayer(clickX, clickY);
}

container.addEventListener("pointerdown", handlePointerDown);

container.addEventListener("pointermove", (e) => {
  if (gameStarted && !gameOver) {
    const rect = canvas.getBoundingClientRect();
    crosshair.x = e.clientX - rect.left;
    crosshair.y = e.clientY - rect.top;
    crosshair.active = true;
  }
});

/* BOTONES INFERIORES */
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");

btnLeft.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) { resetGame(); return; }
  playMusic();
  keys.left = true;
});

btnLeft.addEventListener("pointerup", (e) => {
  e.stopPropagation();
  keys.left = false;
});

btnRight.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) { resetGame(); return; }
  playMusic();
  keys.right = true;
});

btnRight.addEventListener("pointerup", (e) => {
  e.stopPropagation();
  keys.right = false;
});

/* TECLADO PC */
window.addEventListener("keydown", (e) => {
  if (!assetsLoaded) return;
  if (!gameStarted || gameOver) {
    if (e.code === "Space" || e.code === "Enter") resetGame();
    return;
  }
  playMusic();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
});

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

requestAnimationFrame(loop);
</script>

</body>
</html>
