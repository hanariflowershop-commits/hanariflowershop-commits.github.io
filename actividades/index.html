<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kanji Trail — Practica escritura japonesa</title>
<style>
:root{--ink:#25252b;--muted:#777985;--pink:#c65c69;--paper:#fffaf4;--line:#e9e0d8;--guide:#ead9d8;--blue:#b9d5e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7eee7,#f8f5f0);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:min(100%,520px);display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}.brand{font-weight:850;letter-spacing:.02em;font-size:21px}.brand span{color:var(--pink)}.pill{font-size:12px;background:#fff;border:1px solid var(--line);padding:7px 11px;border-radius:999px;color:var(--muted)}
.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 35px #5b3b2510}.taskrow{display:flex;align-items:center;gap:14px}.kanji{font-size:48px;line-height:1;font-family:"Noto Serif JP","Yu Mincho",serif}.meaning{font-size:21px;font-weight:750}.reading{font-size:13px;color:var(--muted);margin-top:3px}.meta{margin-left:auto;text-align:right;color:var(--muted);font-size:12px}.progress{height:5px;background:#f0e8e2;border-radius:10px;margin-top:16px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--pink);transition:width .2s}
.canvaswrap{position:relative;width:100%;aspect-ratio:1;background:#fffdf9;border:1px solid var(--line);border-radius:20px;overflow:hidden;touch-action:none}.canvaswrap svg{width:100%;height:100%;display:block;touch-action:none}.gridline{stroke:#eee5dc;stroke-width:.35}.guide{fill:none;stroke:var(--guide);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}.centerline{fill:none;stroke:#d9c8c7;stroke-width:.7;stroke-dasharray:1.5 2.5}.userline{fill:none;stroke:var(--pink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.startdot{fill:var(--pink);stroke:white;stroke-width:1.2}.ghostnum{font-size:5px;fill:#a39a95;font-weight:700}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fffaf4d9;backdrop-filter:blur(3px);text-align:center;padding:24px}.overlay.show{display:flex}.overlay h2{margin:0 0 6px;font-size:26px}.overlay p{color:var(--muted);margin:0 0 14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:13px 12px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--pink);color:white}.secondary{background:#f3eae4;color:var(--ink)}.wide{grid-column:1/-1}.hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.45}.bottom{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}.bottom strong{color:var(--ink)}.smallbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
@media(max-width:380px){body{padding:10px}.card{padding:14px}.kanji{font-size:42px}.meaning{font-size:18px}}
</style></head><body><main class="app">
<header class="top"><div class="brand">KANJI <span>TRAIL</span></div><div class="pill">日本語 · práctica de trazos</div></header>
<section class="card"><div class="taskrow"><div class="kanji" id="bigKanji">木</div><div><div class="meaning" id="meaning">árbol</div><div class="reading" id="reading">き · ki</div></div><div class="meta"><div id="strokeCount">4 trazos</div><div id="stepLabel">Trazo 1 de 4</div></div></div><div class="progress"><div id="progress"></div></div></section>
<section class="canvaswrap" id="board"><svg id="svg" viewBox="0 0 100 100" aria-label="Zona para practicar kanji"><path class="gridline" d="M50 0V100 M0 50H100 M0 0L100 100 M100 0L0 100"/><g id="guides"></g><g id="userpaths"></g><g id="dots"></g></svg><div class="overlay" id="overlay"><div><h2 id="resultTitle">¡Muy bien!</h2><p id="resultText">Has completado el carácter.</p><button class="btn primary" id="overlayNext">Siguiente kanji →</button></div></div></section>
<div class="actions"><button class="btn secondary" id="undo">↶ Borrar trazo</button><button class="btn secondary" id="clear">⟲ Reiniciar</button><button class="btn primary wide" id="next">Kanji aleatorio →</button></div>
<div class="bottom"><span>⭐ Racha: <strong id="streak">0</strong></span><button class="smallbtn" id="toggleGuide">Ocultar guía</button></div><div class="hint" id="hint">Empieza en el punto rosa y sigue la línea tenue. Usa el dedo o el ratón.</div>
</main><script>
const data=[
{c:'一',m:'uno',r:'いち · ichi',s:[['M20 50 L80 50']]},
{c:'二',m:'dos',r:'に · ni',s:[['M25 34 L75 34'],['M18 68 L82 68']]},
{c:'三',m:'tres',r:'さん · san',s:[['M30 25 L70 25'],['M22 48 L78 48'],['M15 73 L85 73']]},
{c:'十',m:'diez',r:'じゅう · juu',s:[['M18 38 L82 38'],['M50 18 L50 84']]},
{c:'人',m:'persona',r:'ひと · hito',s:[['M51 17 Q48 40 22 76'],['M52 43 Q66 60 83 78']]},
{c:'大',m:'grande',r:'おお · oo',s:[['M18 39 L82 39'],['M50 15 L50 83'],['M48 42 Q37 59 17 72']]},
{c:'小',m:'pequeño',r:'ちい · chii',s:[['M50 20 L50 82'],['M30 42 Q27 54 18 63'],['M70 42 Q75 53 83 62']]},
{c:'山',m:'montaña',r:'やま · yama',s:[['M22 25 L22 78'],['M22 52 L78 52'],['M78 20 L78 78']]},
{c:'川',m:'río',r:'かわ · kawa',s:[['M25 22 Q26 49 20 76'],['M50 17 L50 82'],['M76 20 L80 78']]},
{c:'木',m:'árbol',r:'き · ki',s:[['M18 37 L82 37'],['M50 15 L50 85'],['M48 40 Q36 57 18 70'],['M52 42 Q65 58 82 70']]},
{c:'口',m:'boca',r:'くち · kuchi',s:[['M28 25 L72 25 L72 76'],['M28 25 L28 76'],['M28 76 L72 76']]},
{c:'日',m:'sol / día',r:'ひ · hi',s:[['M27 18 L73 18 L73 82'],['M27 18 L27 82'],['M28 49 L72 49'],['M27 82 L73 82']]},
{c:'月',m:'luna / mes',r:'つき · tsuki',s:[['M30 17 L70 17 L66 82'],['M30 17 Q28 52 20 80'],['M28 45 L67 45'],['M25 64 L66 64']]},
{c:'中',m:'dentro / centro',r:'なか · naka',s:[['M25 28 L75 28 L75 72 L25 72 Z'],['M50 15 L50 85']]},
{c:'水',m:'agua',r:'みず · mizu',s:[['M52 15 Q49 42 42 53'],['M47 43 Q34 59 18 67'],['M50 44 Q64 56 82 78'],['M31 38 Q25 56 20 79']]},
{c:'火',m:'fuego',r:'ひ · hi',s:[['M50 18 L50 49'],['M48 43 Q38 58 19 67'],['M51 43 Q65 57 81 66'],['M50 51 Q42 69 33 82']]},
{c:'本',m:'libro / origen',r:'ほん · hon',s:[['M18 34 L82 34'],['M50 14 L50 85'],['M48 37 Q35 54 18 67'],['M52 39 Q65 55 82 67'],['M29 60 L71 60']]},
{c:'天',m:'cielo',r:'てん · ten',s:[['M28 29 L72 29'],['M18 49 L82 49'],['M50 16 L50 84'],['M49 50 Q37 65 19 76']]}
];
const $=id=>document.getElementById(id);let current,order=[],idx=0,stroke=0,streak=0,showGuide=true,drawing=false,points=[],done=[],attempts=0;
const svg=$('svg'),guides=$('guides'),userpaths=$('userpaths'),dots=$('dots');
function shuffle(){order=data.map((_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}idx=0;}
function newKanji(){if(!order.length||idx>=order.length)shuffle();current=data[order[idx++]];stroke=0;done=[];points=[];attempts=0;$('overlay').classList.remove('show');$('bigKanji').textContent=current.c;$('meaning').textContent=current.m;$('reading').textContent=current.r;$('strokeCount').textContent=current.s.length+' trazos';$('hint').textContent='Empieza en el punto rosa y sigue la línea tenue. Usa el dedo o el ratón.';render();}
function pathD(s){return s.join(' ')}
function render(){guides.innerHTML='';userpaths.innerHTML='';dots.innerHTML='';current.s.forEach((parts,i)=>{let d=pathD(parts);let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class','guide');p.style.opacity=showGuide?(i===stroke?'.95':i<stroke?'.22':'.5'):'0';guides.appendChild(p);if(i===stroke&&showGuide){let start=parts[0].match(/-?\d+(?:\.\d+)?/g);if(start&&start.length>=2){let dot=document.createElementNS(svg.namespaceURI,'circle');dot.setAttribute('cx',start[0]);dot.setAttribute('cy',start[1]);dot.setAttribute('r','3.1');dot.setAttribute('class','startdot');dots.appendChild(dot);}}});done.forEach((d,i)=>{let p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',d);p.setAttribute('class','userline');userpaths.appendChild(p)});if(points.length){let p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',points.map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join(' '));p.setAttribute('class','userline');userpaths.appendChild(p)}let pct=(stroke/current.s.length)*100;$('progress').style.width=pct+'%';$('stepLabel').textContent=stroke<current.s.length?`Trazo ${stroke+1} de ${current.s.length}`:'Completado';}
function coord(e){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}}
function getStart(){let str=current.s[stroke][0],nums=str.match(/-?\d+(?:\.\d+)?/g);return{x:+nums[0],y:+nums[1]}}
function start(e){if(stroke>=current.s.length)return;let q=coord(e),s=getStart();if(Math.hypot(q.x-s.x,q.y-s.y)>17){$('hint').textContent='Busca el punto rosa para comenzar este trazo.';return;}drawing=true;points=[q];svg.setPointerCapture?.(e.pointerId);$('hint').textContent='Sigue la forma del carácter sin levantar el dedo.';}
function move(e){if(!drawing)return;let q=coord(e);points.push(q);render();}
function end(){if(!drawing)return;drawing=false;let target=current.s[stroke][0],nums=target.match(/-?\d+(?:\.\d+)?/g).map(Number);let end={x:nums[nums.length-2],y:nums[nums.length-1]};let last=points[points.length-1];let dist=Math.hypot(last.x-end.x,last.y-end.y);let traveled=0;for(let i=1;i<points.length;i++)traveled+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);if(points.length<5||traveled<7){points=[];render();$('hint').textContent='Trazo demasiado corto. Inténtalo otra vez siguiendo la guía.';return;}if(dist>24){points=[];render();$('hint').textContent='Acércate más al final de la línea y vuelve a intentarlo.';return;}done.push(points.map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join(' '));points=[];stroke++;streak++;$('streak').textContent=streak;render();if(stroke>=current.s.length){$('progress').style.width='100%';$('resultTitle').textContent='¡Kanji completado!';$('resultText').textContent=current.c+' · '+current.m+' — ¡buen trabajo!';$('overlay').classList.add('show');$('hint').textContent='¡Listo! Pasa al siguiente carácter para seguir practicando.';}else $('hint').textContent='¡Bien! Ahora sigue el trazo '+(stroke+1)+'.';}
svg.addEventListener('pointerdown',e=>{e.preventDefault();start(e)});svg.addEventListener('pointermove',e=>{if(drawing){e.preventDefault();move(e)}});svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
$('next').onclick=newKanji;$('overlayNext').onclick=newKanji;$('clear').onclick=()=>{stroke=0;done=[];points=[];$('overlay').classList.remove('show');render();$('hint').textContent='Reiniciado. Empieza en el punto rosa.'};$('undo').onclick=()=>{if(points.length){points=[]}else if(stroke>0){stroke--;done.pop()}render();$('overlay').classList.remove('show');$('hint').textContent='Trazo borrado. Vuelve a intentarlo.'};$('toggleGuide').onclick=()=>{showGuide=!showGuide;$('toggleGuide').textContent=showGuide?'Ocultar guía':'Mostrar guía';render()};shuffle();newKanji();
</script></body></html>
