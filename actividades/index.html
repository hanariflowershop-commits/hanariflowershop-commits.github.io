<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Latte Art Studio 3D</title>
<style>
:root{color-scheme:dark;--cream:#f6e7d4;--blue:#315bd7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#815337;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;background:#8d5b3d;color:#fff4e8}
header{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:linear-gradient(#9a6948,#805137);box-shadow:0 2px 8px #3b211d55;z-index:2}
.brand{font-size:12px;font-weight:850;letter-spacing:.14em}.round{border:0;border-radius:50%;width:32px;height:32px;background:#f7e8d6;color:#4d3529;font-size:19px}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#9b6847}
#view{width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;left:9px;top:16%;bottom:17%;width:43px;display:flex;flex-direction:column;align-items:center;z-index:3;pointer-events:none}
.panel label{pointer-events:none;font-size:10px;font-weight:800;color:#50382b;background:#f5e7d7;border-radius:7px;padding:4px 5px;margin-bottom:8px}
#track{pointer-events:auto;position:relative;flex:1;width:28px;max-height:330px;min-height:140px;border-radius:20px;background:linear-gradient(90deg,#c9b4a0,#fff1e0 42%,#c6b19c);box-shadow:inset 0 2px 5px #55372266,0 2px 5px #39201755;touch-action:none}
#fillbar{position:absolute;bottom:0;left:0;right:0;height:18%;border-radius:20px;background:linear-gradient(90deg,#2143b5,#6c8cff 50%,#2446bd)}
#knob{position:absolute;bottom:18%;left:50%;width:39px;height:39px;transform:translate(-50%,50%);border:2px solid #e7ebff;border-radius:50%;background:radial-gradient(circle at 32% 25%,#829dff,#3154d1 70%);box-shadow:0 3px 8px #231c5177;display:grid;place-items:center;color:white;font-size:17px}
.scale{font-size:9px;text-align:center;line-height:1.45;margin-top:7px;text-shadow:0 1px 3px #3b201b}
.pills{position:absolute;right:9px;top:9px;display:flex;gap:5px;z-index:2}.pill{font-size:10px;padding:6px 8px;border-radius:15px;background:#39261fdd;border:1px solid #fff2;color:#fff3e7}
.tip{position:absolute;bottom:10px;left:56px;right:10px;margin:auto;max-width:430px;text-align:center;padding:9px 11px;border-radius:16px;background:#38251edb;border:1px solid #f6dfc433;color:#fff3e5;font-size:11px;line-height:1.35;pointer-events:none}
footer{z-index:4;flex:none;background:#f0e0cd;color:#50382a;padding:9px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;box-shadow:0 -3px 12px #3e201b22}
#tech{font-weight:800;font-size:12px}#subhint{font-size:10px;line-height:1.35}
#resetBottom{border:0;border-radius:13px;background:#3156d6;color:white;font-size:12px;font-weight:850;padding:13px 14px;min-width:112px;box-shadow:0 3px 0 #1f399a}
#result{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#241710b8;padding:22px}
.modal{width:min(320px,100%);border-radius:22px;padding:21px;background:#fff0de;color:#4c3327;text-align:center;box-shadow:0 15px 50px #170d0b77}.modal h2{margin:0 0 5px}.grade{font-size:46px;font-weight:950;color:#3156d6}.modal p{font-size:13px;line-height:1.5}.modal button{border:0;border-radius:12px;padding:11px 14px;background:#3156d6;color:white;font-weight:800}
@media(min-width:700px){#scene{width:min(100%,650px);align-self:center;border-left:2px solid #75472f;border-right:2px solid #75472f}.panel{left:max(10px,calc(50% - 315px))}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">☕ LATTE ART STUDIO · 3D</div><button class="round" id="resetTop" aria-label="Nueva taza">↻</button></header>
<div id="scene">
<canvas id="view"></canvas>
<div class="panel"><label>LECHE</label><div id="track"><div id="fillbar"></div><div id="knob">◒</div></div><div class="scale">SUAVE<br>↓<br>FUERTE</div></div>
<div class="pills"><div class="pill" id="milkPill">Jarra 100%</div><div class="pill" id="cupPill">Taza 68%</div></div>
<div class="tip" id="tip">Arrastra la jarra para moverla. Mantén pulsada la barra azul para verter; desliza para regular el caudal y suelta para parar.</div>
<div id="result"><div class="modal"><h2>Tu latte art</h2><div class="grade" id="grade">86</div><p id="feedback">Buen control del vertido.</p><button id="again">PREPARAR OTRA TAZA</button></div></div>
</div>
<footer><div><div id="tech">Preparado para verter</div><div id="subhint">Acerca la boquilla al café para dibujar.</div></div><button id="resetBottom">NUEVA TAZA ↻</button></footer>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
(()=>{
const canvas=document.querySelector('#view'), sceneEl=document.querySelector('#scene'), $=id=>document.getElementById(id);
let renderer,scene,camera,clock,table,cupGroup,pitcherGroup,coffee,stream,streamMat,spoutTip;
let pouring=false,sliderDrag=false,dragging=false,finished=false,flow=.18,milk=100,fill=68,spill=0,freeMode=true;
let artCanvas,artCtx,artTexture,lastLanding=null,artStroke=0;
let pitcher={x:.43,z:.25,tilt:.28,rot:-.12}, cup={x:.1,z:.48}, lastPointer=null,art=[],artMeshes=[],lastArt=0;
const mats={};
function mat(color,roughness=.55,metalness=0){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function lathe(points,material,segments=64){return new THREE.Mesh(new THREE.LatheGeometry(points.map(p=>new THREE.Vector2(p[0],p[1])),segments),material)}
function makeMaterialTexture(){
 const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
 x.fillStyle='#a87650';x.fillRect(0,0,512,512);
 for(let i=0;i<80;i++){let y=Math.random()*512;x.strokeStyle=i%3?'rgba(69,37,22,.07)':'rgba(255,214,168,.12)';x.lineWidth=1+Math.random()*3;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(130,y-15,350,y+16,512,y+Math.random()*12-6);x.stroke()}
 for(let i=0;i<45;i++){let x0=Math.random()*512,y=Math.random()*512;x.fillStyle='rgba(60,31,17,.17)';x.beginPath();x.ellipse(x0,y,3+Math.random()*7,1+Math.random()*2,Math.random(),0,Math.PI*2);x.fill()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t;
}
function build(){
 scene=new THREE.Scene();scene.background=new THREE.Color('#986443');scene.fog=new THREE.Fog('#986443',7,16);
 camera=new THREE.PerspectiveCamera(38,1,.1,50);camera.position.set(0,5.15,2.55);camera.lookAt(0,.38,.22);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
 scene.add(new THREE.HemisphereLight('#fff0db','#583621',2.0));
 const key=new THREE.DirectionalLight('#fff0dc',3.2);key.position.set(-4,8,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=5;key.shadow.camera.bottom=-5;scene.add(key);
 const fillLight=new THREE.DirectionalLight('#b7ceff',1.0);fillLight.position.set(5,4,-4);scene.add(fillLight);
 const wood=makeMaterialTexture();wood.colorSpace=THREE.SRGBColorSpace;
 table=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({map:wood,roughness:.84}));table.rotation.x=-Math.PI/2;table.position.y=-.12;table.receiveShadow=true;scene.add(table);
 // scattered coffee beans on the table
 const beanMat=mat('#4d2819',.7), beanLine=mat('#b47a4b',.7);
 for(let i=0;i<34;i++){let x=(Math.sin(i*78.1)*2.7),z=(Math.cos(i*31.7)*2.8);if(Math.abs(x)<1.5&&z>-.8&&z<1.7)continue;
  const b=new THREE.Mesh(new THREE.SphereGeometry(.055,12,8),beanMat);b.scale.set(1.5,.55,.75);b.position.set(x,-.045,z);b.rotation.y=i*.73;b.castShadow=true;scene.add(b);
 }
 buildCup();buildPitcher();buildStream();
 window.addEventListener('resize',resize);resize();animate();
}
function buildCup(){
 cupGroup=new THREE.Group();cupGroup.position.set(cup.x,0,cup.z);scene.add(cupGroup);
 const porcelain=mat('#f4eee4',.2), porcelainEdge=mat('#fffaf2',.17), blue=mat('#315bd6',.25), blueEdge=mat('#6e8fff',.22);
 const saucer=lathe([[0,.03],[.52,.03],[.68,.065],[.72,.09],[.68,.12],[.5,.1],[0,.1]],blue);saucer.castShadow=true;saucer.receiveShadow=true;cupGroup.add(saucer);
 const rim=lathe([[.0,.13],[.40,.13],[.47,.17],[.48,.22],[.44,.24],[.42,.21],[.0,.21]],porcelain);rim.position.y=.02;rim.castShadow=true;cupGroup.add(rim);
 const body=lathe([[.34,.16],[.39,.2],[.43,.29],[.48,.57],[.47,.63],[.42,.65],[.39,.59],[.37,.3],[.32,.21],[0,.2]],porcelain);body.castShadow=true;body.receiveShadow=true;cupGroup.add(body);
 // thick white lip, coffee disc
 const lip=lathe([[.0,.63],[.405,.63],[.445,.65],[.44,.68],[.4,.68],[0,.66]],porcelainEdge);cupGroup.add(lip);
 const coffeeMat=mat('#60331f',.24), crema=mat('#a76c43',.35);
 artCanvas=document.createElement('canvas');artCanvas.width=artCanvas.height=768;artCtx=artCanvas.getContext('2d');
 artTexture=new THREE.CanvasTexture(artCanvas);artTexture.colorSpace=THREE.SRGBColorSpace;artTexture.anisotropy=8;coffeeMat.map=artTexture;coffeeMat.needsUpdate=true;
 paintCoffee();
 coffee=new THREE.Mesh(new THREE.CircleGeometry(.405,128),coffeeMat);coffee.rotation.x=-Math.PI/2;coffee.position.y=.657;coffee.receiveShadow=true;cupGroup.add(coffee);
 const cremaRing=new THREE.Mesh(new THREE.TorusGeometry(.407,.014,8,96),crema);cremaRing.rotation.x=Math.PI/2;cremaRing.position.y=.66;cupGroup.add(cremaRing);
 // coffee surface subtle warm highlight
 
 const handle=new THREE.Mesh(new THREE.TorusGeometry(.24,.065,16,48),porcelain);handle.position.set(.51,.43,.02);handle.rotation.y=Math.PI/2;handle.scale.set(1,1.15,1);handle.castShadow=true;cupGroup.add(handle);
}
function buildPitcher(){
 pitcherGroup=new THREE.Group();scene.add(pitcherGroup);
 const steel=new THREE.MeshStandardMaterial({color:'#cbd3d5',metalness:.92,roughness:.17}), bright=new THREE.MeshStandardMaterial({color:'#ffffff',metalness:.82,roughness:.12}), dark=mat('#343d40',.24,.78);
 // lathed stainless pitcher, local Y is vertical
 const body=lathe([[.0,0],[.25,0],[.34,.08],[.39,.34],[.37,.65],[.31,.82],[.0,.84]],steel);body.castShadow=true;body.receiveShadow=true;pitcherGroup.add(body);
 const rim=lathe([[.0,.80],[.31,.80],[.35,.83],[.32,.87],[.0,.86]],bright);pitcherGroup.add(rim);
 const inside=lathe([[0,.818],[.28,.818],[.31,.824],[0,.824]],dark);pitcherGroup.add(inside);
 // pointed pouring spout
 const spout=new THREE.Mesh(new THREE.ConeGeometry(.12,.29,32),steel);spout.position.set(-.23,.72,0);spout.rotation.z=Math.PI*.32;spout.scale.set(1,.65,1);spout.castShadow=true;pitcherGroup.add(spout);
 // loop handle behind body
 const handle=new THREE.Mesh(new THREE.TorusGeometry(.22,.045,14,40),steel);handle.position.set(.37,.48,0);handle.rotation.y=Math.PI/2;handle.scale.set(1,1.22,1);handle.castShadow=true;pitcherGroup.add(handle);
 // Subtle highlight strip
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(.025,.5,.012),bright);stripe.position.set(.12,.45,.333);pitcherGroup.add(stripe);
 // The actual nozzle tip is tracked in 3D, so the milk stream starts at the spout, not the pitcher centre.
 spoutTip=new THREE.Object3D();spoutTip.position.set(-.34,.61,0);pitcherGroup.add(spoutTip);
 pitcherGroup.scale.setScalar(.85);updatePitcher();
}
function buildStream(){
 const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,1,0)]);
 streamMat=new THREE.MeshBasicMaterial({color:'#fff1d8',transparent:true,opacity:.92});
 stream=new THREE.Mesh(new THREE.CylinderGeometry(.018,.028,1,12),streamMat);stream.visible=false;scene.add(stream);
}
function updatePitcher(){
 pitcherGroup.position.set(pitcher.x,.75,pitcher.z);pitcherGroup.rotation.set(pitcher.tilt,0,pitcher.rot,'XYZ');pitcherGroup.updateMatrixWorld(true);
}
function getSpoutWorld(){pitcherGroup.updateMatrixWorld(true);return spoutTip.getWorldPosition(new THREE.Vector3())}
function resize(){if(!renderer||!camera)return;const r=sceneEl.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function screenToPlane(clientX,clientY){
 const r=canvas.getBoundingClientRect(),ndc=new THREE.Vector2((clientX-r.left)/r.width*2-1,-((clientY-r.top)/r.height*2-1));
 const ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const out=new THREE.Vector3();ray.ray.intersectPlane(plane,out);return out;
}
function paintCoffee(){
 if(!artCtx)return;
 const c=artCtx,w=artCanvas.width,h=artCanvas.height;c.clearRect(0,0,w,h);
 const g=c.createRadialGradient(w*.42,h*.35,12,w*.5,h*.5,w*.56);g.addColorStop(0,'#8a4c2b');g.addColorStop(.68,'#6b3822');g.addColorStop(1,'#492416');c.fillStyle=g;c.fillRect(0,0,w,h);
 // subtle crema mottling
 for(let i=0;i<85;i++){const x=(Math.sin(i*37.7)*.5+.5)*w,y=(Math.cos(i*19.3)*.5+.5)*h;c.fillStyle=i%2?'rgba(216,158,105,.045)':'rgba(34,13,7,.05)';c.beginPath();c.ellipse(x,y,4+(i%7)*2,3+(i%5)*2,i*.71,0,Math.PI*2);c.fill()}
 c.strokeStyle='#b47b50';c.lineWidth=10;c.beginPath();c.arc(w/2,h/2,w*.485,0,Math.PI*2);c.stroke();
 for(const a of art){if(a.type==='dot'){c.fillStyle='#fff2d9';c.beginPath();c.ellipse(a.x*w,a.y*h,a.r*w,a.r*h,0,0,Math.PI*2);c.fill();}
 else if(a.type==='line'){c.lineCap='round';c.lineJoin='round';c.strokeStyle='#fff0d6';c.lineWidth=a.width*w;c.beginPath();c.moveTo(a.points[0][0]*w,a.points[0][1]*h);for(let i=1;i<a.points.length;i++)c.lineTo(a.points[i][0]*w,a.points[i][1]*h);c.stroke();}}
 if(artTexture)artTexture.needsUpdate=true;
}
function addMilkAt(x,z){
 // Map the actual pour landing point onto the top-down coffee texture.
 const u=.5+(x-cup.x)/(.81),v=.5+(z-cup.z)/(.81);
 if(u<.06||u>.94||v<.06||v>.94)return;
 const r=.008+flow*.008;
 art.push({type:'dot',x:u,y:v,r:r});
 // A gentle alternating wiggle makes the stream develop into a rosetta instead of random dots.
 if(lastLanding){
  const du=u-lastLanding.u,dv=v-lastLanding.v;
  if(Math.hypot(du,dv)>.001){
   const cx=.5,cy=.5,dx=u-cx,dy=v-cy;
   const side=(artStroke%2?1:-1), spread=.012+flow*.018;
   const leafU=Math.max(.09,Math.min(.91,u+side*spread));
   art.push({type:'line',width:.006+flow*.004,points:[[lastLanding.u,lastLanding.v],[leafU,Math.max(.08,Math.min(.92,v-.006))],[u,v]]});
   artStroke++;
  }
 }
 lastLanding={u,v};
 if(art.length>450)art.splice(0,30);
 paintCoffee();
}
function updateStream(){
 if(!pouring||milk<=0){stream.visible=false;return}
 const from=getSpoutWorld();
 // The stream falls vertically from the real tip of the spout to the coffee surface.
 const to=new THREE.Vector3(from.x,.675,from.z);
 const dist=Math.hypot(from.x-cup.x,from.z-cup.z);
 stream.visible=dist<.48&&from.y>.70;
 if(stream.visible){const vec=to.clone().sub(from);stream.position.copy(from.clone().add(to).multiplyScalar(.5));stream.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vec.clone().normalize());stream.scale.set(1,vec.length(),1);streamMat.opacity=.72+flow*.25;stream.geometry.dispose();stream.geometry=new THREE.CylinderGeometry(.008+flow*.009,.013+flow*.015,1,16)}
}
function updateUI(){$('fillbar').style.height=(flow*100)+'%';$('knob').style.bottom=(flow*100)+'%';$('milkPill').textContent='Jarra '+Math.round(milk)+'%';$('cupPill').textContent='Taza '+Math.round(fill)+'%'}
function begin(){if(finished)return;pouring=true;$('tech').textContent='Vertiendo leche';$('subhint').textContent='Mueve la jarra sobre el café; suelta la barra para parar.'}
function end(){pouring=false;stream.visible=false}
function tickPour(dt){
 if(!pouring||finished||milk<=0)return;
 const amount=(.45+flow*3.6)*dt;milk=Math.max(0,milk-amount*1.15);
 const nozzle=getSpoutWorld();const spoutX=nozzle.x,spoutZ=nozzle.z;
 const dx=spoutX-cup.x,dz=spoutZ-cup.z,inside=Math.hypot(dx,dz)<.40;
 if(inside){
  fill=Math.min(100,fill+amount*(.32+flow*1.8));
  if(performance.now()-lastArt>48){lastArt=performance.now();addMilkAt(spoutX,spoutZ)}
  if(fill>=100){spill+=amount;$('tech').textContent='La taza está llena';$('subhint').textContent='Suelta la barra para detener el vertido.'}
  else if(pitcher.tilt>.35){$('tech').textContent='Dibujando latte art';$('subhint').textContent='Controla el caudal y mueve la jarra suavemente.'}
  else{$('tech').textContent='Mezclando la leche';$('subhint').textContent='Inclina un poco más la jarra para dibujar.'}
 }else{$('tech').textContent='La leche cae fuera';$('subhint').textContent='Mueve la boquilla sobre la taza.';spill+=amount*.7}
 if(milk<=0){end();$('tech').textContent='Jarra vacía';$('subhint').textContent='Pulsa ↻ para preparar otra taza.'}
 updateUI();
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock?clock.getDelta():.016);if(!clock)clock=new THREE.Clock();tickPour(dt);updateStream();renderer.render(scene,camera)}
function reset(){pouring=false;sliderDrag=false;dragging=false;finished=false;milk=100;fill=68;spill=0;flow=.18;lastLanding=null;artStroke=0;art=[];paintCoffee();pitcher={x:.43,z:.25,tilt:.28,rot:-.12};artMeshes.forEach(m=>{cupGroup.remove(m);m.geometry.dispose();m.material.dispose()});artMeshes=[];updatePitcher();updateUI();$('result').style.display='none';$('tech').textContent='Preparado para verter';$('subhint').textContent='Acerca la boquilla al café para dibujar.';end()}
$('track').addEventListener('pointerdown',e=>{sliderDrag=true;$('track').setPointerCapture(e.pointerId);const r=$('track').getBoundingClientRect();flow=Math.max(.03,Math.min(1,1-(e.clientY-r.top)/r.height));updateUI();begin();$('tip').textContent='VERTIENDO: desliza la barra para cambiar el caudal. Suelta para parar.';e.preventDefault()});
$('track').addEventListener('pointermove',e=>{if(!sliderDrag)return;const r=$('track').getBoundingClientRect();flow=Math.max(.03,Math.min(1,1-(e.clientY-r.top)/r.height));updateUI()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('track').addEventListener(ev,()=>{if(sliderDrag){sliderDrag=false;end();$('tip').textContent='Arrastra la jarra. Mantén pulsada la barra azul para verter; desliza para regular el caudal y suelta para parar.'}}));
canvas.addEventListener('pointerdown',e=>{dragging=true;lastPointer=screenToPlane(e.clientX,e.clientY);canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=screenToPlane(e.clientX,e.clientY);if(p&&lastPointer){pitcher.x=Math.max(-1.8,Math.min(2.1,pitcher.x+(p.x-lastPointer.x)));pitcher.z=Math.max(-1.5,Math.min(1.8,pitcher.z+(p.z-lastPointer.z)));pitcher.rot=Math.max(-.7,Math.min(.9,pitcher.rot+(p.x-lastPointer.x)*.55));pitcher.tilt=Math.max(-.25,Math.min(1.05,pitcher.tilt-(p.z-lastPointer.z)*.5));updatePitcher();lastPointer=p}e.preventDefault()});
function stopDrag(){dragging=false;lastPointer=null}canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
$('resetTop').onclick=reset;$('resetBottom').onclick=reset;$('again').onclick=reset;
build();updateUI();
})();
</script>
</body>
</html>
